<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>TOEIC QUEST - 英単語で魔王を倒せ</title>
<style>
/* TOEIC QUEST - DQ1-style retro RPG styling */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --win-bg: #000;
  --win-border: #fff;
  --accent: #ffd54a;
  --danger: #ff5a5a;
  --good: #6fe36f;
}

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: "Courier New", "MS Gothic", "Hiragino Kaku Gothic ProN", monospace, sans-serif;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: #000;
}

#game-wrap {
  position: relative;
  width: 100%;
  max-width: 560px;
  flex: 1;
  display: flex; flex-direction: column;
  overflow: hidden;
}

#screen {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 0;
  background: #000;
  image-rendering: pixelated;
}

canvas#field-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* ---------- DQ-style windows ---------- */
.dq-window {
  background: var(--win-bg);
  border: 3px solid var(--win-border);
  border-radius: 8px;
  box-shadow: 0 0 0 3px #000, inset 0 0 0 1px #000;
  color: #fff;
  padding: 10px 12px;
  font-size: 15px;
  line-height: 1.7;
  letter-spacing: 1px;
}

/* status window top-left on field */
#status-win {
  position: absolute; top: 8px; left: 8px;
  min-width: 120px;
  font-size: 13px;
  line-height: 1.5;
  z-index: 5;
  pointer-events: none;
}
#status-win .name { color: var(--accent); }

/* message window */
#msg-win {
  position: absolute; left: 4%; right: 4%; bottom: 14%;
  min-height: 96px;
  z-index: 30;
  display: none;
  white-space: pre-wrap;
}
#msg-win .arrow {
  position: absolute; bottom: 2px; right: 12px;
  animation: blink 0.8s infinite;
}
@keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }

/* command menu */
.menu-win {
  position: absolute;
  z-index: 40;
  display: none;
  min-width: 150px;
}
.menu-win .menu-item {
  padding: 3px 6px 3px 22px;
  position: relative;
  cursor: pointer;
  white-space: nowrap;
}
.menu-win .menu-item.sel::before {
  content: "▶";
  position: absolute; left: 2px;
  color: #fff;
  animation: blink 1s infinite;
}
.menu-win .menu-item.disabled { color: #777; }
.menu-title {
  color: var(--accent);
  border-bottom: 2px solid #fff;
  margin-bottom: 4px; padding-bottom: 2px;
  font-size: 13px;
}

#cmd-win { left: 8px; bottom: 30%; }
#sub-win { left: 170px; bottom: 26%; max-height: 46%; overflow-y: auto; }

/* ---------- battle ---------- */
#battle-screen {
  position: absolute; inset: 0;
  display: none;
  background: #000;
  z-index: 20;
  overflow: hidden;
}
#battle-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 30%, #1a2a4a 0%, #050510 70%);
}
#battle-frame {
  position: absolute; top: 6%; left: 50%; transform: translateX(-50%);
  width: 78%; max-width: 380px; aspect-ratio: 4/3;
  border: 3px solid #fff; border-radius: 6px;
  background: linear-gradient(#0b1030 0%, #0b1030 62%, #123018 62%, #123018 100%);
  display: flex; align-items: center; justify-content: center;
}
#enemy-sprite {
  font-size: 96px;
  line-height: 1;
  filter: contrast(1.15) saturate(1.2);
  text-shadow: 0 6px 18px rgba(0,0,0,.7);
  transition: transform .08s, opacity .4s, filter .3s;
}
#enemy-sprite.hit { transform: scale(1.08) translateX(4px); filter: brightness(3); }
#enemy-sprite.dead { opacity: 0; transform: scale(.2) rotate(20deg); }
#enemy-sprite.boss { font-size: 130px; }
#enemy-name-tag {
  position: absolute; top: 4px; left: 8px;
  font-size: 13px; color: #fff; text-shadow: 1px 1px 0 #000;
}
#enemy-hp-bar {
  position: absolute; bottom: 6px; left: 8%; right: 8%;
  height: 8px; border: 1px solid #fff; border-radius: 4px; background: #300;
}
#enemy-hp-bar > div {
  height: 100%; background: var(--danger); border-radius: 3px;
  transition: width .3s;
}
#battle-status {
  position: absolute; top: 8px; left: 8px; z-index: 5;
  font-size: 13px; line-height: 1.5; min-width: 118px;
}
#battle-msg {
  position: absolute; left: 4%; right: 4%; bottom: 25%;
  min-height: 84px; z-index: 25; display: none; white-space: pre-wrap;
}
#battle-cmd { left: 8px; bottom: 2%; z-index: 26; }
#battle-sub { left: 170px; bottom: 2%; z-index: 27; max-height: 40%; overflow-y: auto; }

.shake { animation: shake .35s; }
@keyframes shake {
  0%,100% { transform: translate(0,0); }
  20% { transform: translate(-8px,4px); }
  40% { transform: translate(8px,-4px); }
  60% { transform: translate(-6px,-3px); }
  80% { transform: translate(6px,3px); }
}
.flash-red { animation: flashred .3s; }
@keyframes flashred {
  0%,100% { background-color: transparent; }
  50% { background-color: rgba(255,0,0,.35); }
}

/* ---------- quiz ---------- */
#quiz-overlay {
  position: absolute; inset: 0;
  z-index: 60;
  display: none;
  background: rgba(0,0,10,.82);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
}
#quiz-box {
  width: 96%; max-width: 430px;
  text-align: center;
}
#quiz-level-tag {
  color: var(--accent); font-size: 13px; margin-bottom: 4px; letter-spacing: 2px;
}
#quiz-word {
  font-size: 34px;
  font-weight: bold;
  color: #fff;
  margin: 6px 0 4px;
  letter-spacing: 1px;
  word-break: break-all;
}
#quiz-hint { font-size: 12px; color: #9ad; margin-bottom: 8px; }
#timer-bar-wrap {
  width: 100%; height: 14px;
  border: 2px solid #fff; border-radius: 7px;
  margin: 6px 0 12px; overflow: hidden; background: #222;
}
#timer-bar {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #6fe36f, #ffd54a 60%, #ff5a5a);
  transform-origin: left center;
}
.quiz-choice {
  display: block; width: 100%;
  margin: 7px 0;
  padding: 11px 10px;
  background: #000;
  border: 2px solid #fff; border-radius: 8px;
  color: #fff; font-size: 17px;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
}
.quiz-choice .num { color: var(--accent); margin-right: 8px; }
.quiz-choice:active { background: #234; }
.quiz-choice.correct { background: #063; border-color: var(--good); }
.quiz-choice.wrong { background: #611; border-color: var(--danger); }
#quiz-result {
  font-size: 22px; font-weight: bold; min-height: 30px; margin-top: 6px;
}
#quiz-result.ok { color: var(--good); }
#quiz-result.ng { color: var(--danger); }

/* ---------- title ---------- */
#title-screen {
  position: absolute; inset: 0;
  z-index: 80;
  background: radial-gradient(ellipse at 50% 20%, #12224a, #000 75%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  color: #fff;
}
#title-logo {
  font-size: 44px; font-weight: bold;
  color: var(--accent);
  text-shadow: 3px 3px 0 #922, 6px 6px 0 #000;
  letter-spacing: 4px;
  margin-bottom: 4px;
}
#title-sub { font-size: 14px; color: #cde; margin-bottom: 40px; letter-spacing: 2px; }
.title-btn {
  display: block;
  margin: 10px auto;
  padding: 12px 34px;
  font-size: 17px;
  font-family: inherit;
  background: #000; color: #fff;
  border: 3px solid #fff; border-radius: 8px;
  cursor: pointer;
  letter-spacing: 3px;
}
.title-btn:active { background: #234; }
#title-copy { position: absolute; bottom: 66px; font-size: 11px; color: #789; }

/* ---------- touch controls ---------- */
#controls {
  position: relative;
  width: 100%;
  height: 168px;
  flex: none;
  background: #0a0a12;
  border-top: 2px solid #223;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
  z-index: 90;
}
#dpad {
  position: relative;
  width: 138px; height: 138px;
}
.dpad-btn {
  position: absolute;
  width: 46px; height: 46px;
  background: #223;
  border: 2px solid #445;
  border-radius: 8px;
  color: #9ab;
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
}
.dpad-btn:active { background: #345; }
#dpad-up    { top: 0; left: 46px; }
#dpad-down  { bottom: 0; left: 46px; }
#dpad-left  { top: 46px; left: 0; }
#dpad-right { top: 46px; right: 0; }
#ab-btns { display: flex; gap: 16px; align-items: center; }
.act-btn {
  width: 62px; height: 62px;
  border-radius: 50%;
  border: 3px solid #556;
  color: #fff; font-size: 17px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
}
#btn-a { background: #16324a; border-color: #4aa3ff; }
#btn-b { background: #3a1a1a; border-color: #ff7a7a; }
.act-btn:active { filter: brightness(1.6); }
.btn-label { font-size: 10px; color: #789; text-align: center; margin-top: 3px; }

/* ---------- ad banner placeholder ---------- */
#ad-banner {
  width: 100%;
  height: 42px;
  flex: none;
  background: repeating-linear-gradient(45deg, #1a1a24, #1a1a24 12px, #12121c 12px, #12121c 24px);
  color: #667;
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  letter-spacing: 2px;
  border-top: 1px solid #223;
}
#ad-banner.hidden { display: none; }

/* misc */
.gold-text { color: var(--accent); }
#fade-layer {
  position: absolute; inset: 0; background: #000;
  opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 70;
}
#fade-layer.on { opacity: 1; }

@media (max-height: 640px) {
  #controls { height: 132px; }
  #dpad { width: 114px; height: 114px; }
  .dpad-btn { width: 38px; height: 38px; }
  #dpad-up { left: 38px; } #dpad-down { left: 38px; }
  #dpad-left { top: 38px; } #dpad-right { top: 38px; }
  .act-btn { width: 52px; height: 52px; }
}

/* ---------- battle juice ---------- */
.battle-pop {
  position: absolute; top: 30%;
  font-size: 30px; font-weight: bold; color: #fff;
  text-shadow: 2px 2px 0 #000, 0 0 12px rgba(0,0,0,.8);
  animation: bpop .85s ease-out forwards;
  pointer-events: none; z-index: 5;
  font-family: "Courier New", monospace;
}
.battle-pop.crit { color: #ffd54a; font-size: 40px; }
.battle-pop.weak { color: #7fe3ff; font-size: 22px; }
@keyframes bpop {
  0% { transform: translateY(0) scale(.5); opacity: 0; }
  15% { transform: translateY(-8px) scale(1.2); opacity: 1; }
  100% { transform: translateY(-44px) scale(1); opacity: 0; }
}
.slash-fx {
  position: absolute; inset: 8%;
  background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%);
  animation: slashmove .3s ease-out forwards;
  pointer-events: none; z-index: 4;
}
@keyframes slashmove {
  0% { transform: translateX(-60%) skewX(-12deg); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateX(60%) skewX(-12deg); opacity: 0; }
}
#enemy-sprite.lunge { animation: lunge .38s ease-in-out; }
@keyframes lunge {
  0%,100% { transform: translateY(0); }
  35% { transform: translateY(26px) scale(1.06); }
}

/* ---------- word encyclopedia (zukan) ---------- */
#zukan {
  position: absolute; inset: 0; z-index: 55;
  background: #05060f;
  display: none; flex-direction: column;
}
#zukan.on { display: flex; }
#zukan-head {
  flex: none; display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; border-bottom: 2px solid #223;
}
#zukan-title { font-size: 17px; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
#zukan-close { font-size: 13px; color: #9ab; padding: 6px 10px; border: 1px solid #445; border-radius: 8px; cursor: pointer; }
#zukan-close:active { background: #234; }
#zukan-tabs { flex: none; display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; }
.ztab {
  flex: none; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: bold;
  border: 1px solid #445; color: #9ab; cursor: pointer; white-space: nowrap;
}
.ztab.on { background: #234; color: #fff; border-color: var(--accent); }
#zukan-summary { flex: none; padding: 4px 14px 8px; font-size: 12.5px; color: #cde; letter-spacing: 1px; }
#zukan-list { flex: 1; overflow-y: auto; padding: 0 10px 20px; -webkit-overflow-scrolling: touch; }
.zrow {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 6px; border-bottom: 1px solid #16182a; font-size: 14px;
}
.zrow .zstar { flex: none; width: 20px; text-align: center; }
.zstar.gold { color: #ffd54a; text-shadow: 0 0 6px rgba(255,213,74,.8); }
.zstar.silver { color: #cfd8e6; }
.zstar.bronze { color: #d08a4a; }
.zstar.none { color: #333952; }
.zrow .zw { flex: none; width: 42%; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zrow .zm { flex: 1; color: #9ab; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zrow .zm.hidden-m { color: #444a66; letter-spacing: 2px; }
.zrow .zweak { flex: none; color: var(--danger); font-weight: bold; font-size: 12px; }

/* combo badge in battle */
#combo-badge {
  position: absolute; top: 8px; right: 10px; z-index: 6;
  display: none; text-align: center;
  color: var(--accent); font-weight: bold; font-size: 26px; line-height: 1;
  text-shadow: 2px 2px 0 #000, 0 0 14px rgba(255,180,60,.5);
  pointer-events: none;
}
#combo-badge .cl { display: block; font-size: 9px; letter-spacing: 3px; margin-top: 2px; }
#combo-badge .cm { display: block; font-size: 11px; color: #ffab5c; margin-top: 1px; }
#combo-badge.bump { animation: combobump .3s; }
@keyframes combobump { 40% { transform: scale(1.35); } }

</style>

<div id="app">
  <div id="game-wrap">
    <div id="screen">
      <canvas id="field-canvas"></canvas>
      <div id="status-win" class="dq-window"></div>

      <!-- battle -->
      <div id="battle-screen">
        <div id="battle-bg"></div>
        <div id="battle-frame">
          <div id="enemy-name-tag"></div>
          <div id="enemy-sprite">👾</div>
          <div id="enemy-hp-bar"><div></div></div>
        </div>
        <div id="battle-status" class="dq-window"></div>
        <div id="battle-msg" class="dq-window"></div>
        <div id="combo-badge"></div>
        <div id="battle-cmd" class="dq-window menu-win"></div>
        <div id="battle-sub" class="dq-window menu-win"></div>
      </div>

      <!-- field message / menus -->
      <div id="msg-win" class="dq-window"></div>
      <div id="cmd-win" class="dq-window menu-win"></div>
      <div id="sub-win" class="dq-window menu-win"></div>

      <!-- quiz overlay -->
      <div id="quiz-overlay">
        <div id="quiz-box" class="dq-window">
          <div id="quiz-level-tag"></div>
          <div id="quiz-word"></div>
          <div id="quiz-hint"></div>
          <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
          <div id="quiz-choices"></div>
          <div id="quiz-result"></div>
        </div>
      </div>

      <!-- word encyclopedia -->
      <div id="zukan">
        <div id="zukan-head">
          <div id="zukan-title">たんごずかん</div>
          <div id="zukan-close">✕ とじる</div>
        </div>
        <div id="zukan-tabs"></div>
        <div id="zukan-summary"></div>
        <div id="zukan-list"></div>
      </div>

      <div id="fade-layer"></div>

      <!-- title -->
      <div id="title-screen">
        <div id="title-logo">TOEIC<br>QUEST</div>
        <div id="title-sub">～ 英単語で魔王を倒せ ～</div>
        <button id="btn-continue" class="title-btn">つづきから</button>
        <button id="btn-new" class="title-btn">はじめから</button>
        <button id="btn-settings" class="title-btn">せってい</button>
        <div id="title-copy">攻撃するには英単語に5秒以内に答えろ！<br>TOEIC400〜900・全3000語収録</div>
      </div>
    </div>

    <!-- touch controls -->
    <div id="controls">
      <div id="dpad">
        <div id="dpad-up" class="dpad-btn">▲</div>
        <div id="dpad-down" class="dpad-btn">▼</div>
        <div id="dpad-left" class="dpad-btn">◀</div>
        <div id="dpad-right" class="dpad-btn">▶</div>
      </div>
      <div id="ab-btns">
        <div>
          <div id="btn-b" class="act-btn">Ｂ</div>
          <div class="btn-label">メニュー/もどる</div>
        </div>
        <div>
          <div id="btn-a" class="act-btn">Ａ</div>
          <div class="btn-label">はなす/けってい</div>
        </div>
      </div>
    </div>

    <!-- ad placeholder (hidden when premium) -->
    <div id="ad-banner">AD ─ 広告スペース（プレミアムで非表示）</div>
  </div>
</div>

(function () {
  "use strict";

  // ---------- overworld (code-built, 40 x 36) ----------
  var OW_W = 40, OW_H = 36;

  function buildOverworld() {
    var g = [];
    for (var y = 0; y < OW_H; y++) {
      g.push(new Array(OW_W).fill("w"));
    }
    function rect(x0, y0, x1, y1, ch) {
      for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) g[y][x] = ch;
    }
    function put(x, y, ch) { g[y][x] = ch; }

    // landmass
    rect(2, 2, 37, 33, ".");
    // rounded-ish coast corners
    rect(2, 2, 5, 3, "w"); rect(2, 2, 3, 5, "w");
    rect(34, 2, 37, 3, "w"); rect(36, 2, 37, 5, "w");
    rect(2, 30, 4, 33, "w"); rect(2, 32, 6, 33, "w");
    rect(35, 32, 37, 33, "w");

    // seeded decoration (deterministic)
    var seed = 20260710;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    for (var y = 2; y < 34; y++) {
      for (var x = 2; x < 38; x++) {
        if (g[y][x] !== ".") continue;
        var r = rnd();
        if (r < 0.16) g[y][x] = "t";
        else if (r < 0.19) g[y][x] = "s";
      }
    }

    rect(2, 21, 13, 21, "w");         // west horizontal river
    rect(13, 21, 13, 33, "w");        // south vertical river

    put(18, 9, "b");
    put(28, 17, "b");
    put(10, 21, "b");
    put(13, 27, "b");

    rect(29, 27, 37, 33, "m");

<script>
// TOEIC QUEST - BGM player (file-based)
// Plays assets/bgm/<track>.mp3 (title/field/town/dungeon/battle/boss),
// looped with a short crossfade. If a file is missing: silence (no fallback).
// Drop high-quality tracks in and they play automatically.
(function () {
  "use strict";

  var TRACKS = ["title", "field", "town", "dungeon", "battle", "boss"];
  var VOLUME = 0.55;

  var enabled = true;
  try { enabled = localStorage.getItem("tq_bgm") !== "0"; } catch (e) {}

  var cache = {};   // name -> HTMLAudioElement | "no"
  var cur = null;   // current track name
  var playing = null; // current Audio element
  var unlocked = false;

  function probe(name, cb) {
    if (cache[name]) { cb(cache[name]); return; }
    var a = new Audio();
    a.preload = "auto";
    a.loop = true;
    a.volume = VOLUME;
    a.oncanplaythrough = function () { a.oncanplaythrough = null; cache[name] = a; cb(a); };
    a.onerror = function () { cache[name] = "no"; cb("no"); };
    a.src = "assets/bgm/" + name + ".mp3";
  }

  function fadeOut(a) {
    if (!a) return;
    var v = a.volume;
    var iv = setInterval(function () {
      v -= 0.08;
      if (v <= 0) { clearInterval(iv); a.pause(); a.currentTime = 0; a.volume = VOLUME; }
      else a.volume = v;
    }, 40);
  }

  function startTrack(name) {
    probe(name, function (a) {
      if (a === "no" || cur !== name || !enabled) return;
      if (playing && playing !== a) fadeOut(playing);
      playing = a;
      a.volume = VOLUME;
      var p = a.play();
      if (p && p.catch) p.catch(function () { /* needs user gesture; retried on unlock */ });
    });
  }

  function play(name) {
    if (TRACKS.indexOf(name) < 0) return;
    if (cur === name) return;
    cur = name;
    if (!enabled) return;
    if (unlocked) startTrack(name);
    // if not unlocked yet, the gesture handler below starts it
  }

  function stop() {
    if (playing) { fadeOut(playing); playing = null; }
  }

  function setEnabled(v) {
    enabled = v;
    try { localStorage.setItem("tq_bgm", v ? "1" : "0"); } catch (e) {}
    if (!v) stop();
    else if (cur) startTrack(cur);
  }

  // browsers require a user gesture before audio can start
  ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
    window.addEventListener(ev, function () {
      unlocked = true;
      if (cur && enabled && (!playing || playing.paused)) startTrack(cur);
    }, { passive: true });
  });

  window.BGM = { play: play, stop: stop, setEnabled: setEnabled, isEnabled: function () { return enabled; } };
})();

</script>
<script>
// TOEIC QUEST - quiz module
// QUIZ.ask(level, {time}) -> Promise<{correct, elapsed, entry, timeout}>
(function () {
  "use strict";

  var overlay, box, levelTag, wordEl, hintEl, timerBar, choicesEl, resultEl;

  function $(id) { return document.getElementById(id); }

  function initDom() {
    overlay = $("quiz-overlay");
    levelTag = $("quiz-level-tag");
    wordEl = $("quiz-word");
    hintEl = $("quiz-hint");
    timerBar = $("timer-bar");
    choicesEl = $("quiz-choices");
    resultEl = $("quiz-result");
  }

  var POS_LABEL = { n: "名詞", v: "動詞", adj: "形容詞", adv: "副詞", phr: "熟語" };

  function availableLevels() {
    return Object.keys(window.VOCAB || {}).map(Number).sort(function (a, b) { return a - b; });
  }

  // fall back to nearest stocked level if requested one is missing
  function resolveLevel(level) {
    var ls = availableLevels();
    if (!ls.length) return null;
    var best = ls[0], bd = Infinity;
    ls.forEach(function (l) {
      var d = Math.abs(l - level);
      if (d < bd) { bd = d; best = l; }
    });
    return best;
  }

  function studyRec(word) {
    var G = window.G;
    if (!G) return null;
    G.study = G.study || { missed: {}, answered: 0, correct: 0 };
    return G.study;
  }

  // weighted pick: words answered wrong recently appear ~4x more often
  function pickEntry(level) {
    var pool = window.VOCAB[level];
    var st = studyRec();
    var missed = st ? st.missed : {};
    var weights = [], total = 0;
    for (var i = 0; i < pool.length; i++) {
      var m = missed[pool[i].w];
      var w = (m && m.wrong > 0 && (m.correctStreak || 0) < 2) ? 4 : 1;
      total += w; weights.push(total);
    }
    var r = Math.random() * total;
    var lo = 0, hi = weights.length - 1;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (weights[mid] < r) lo = mid + 1; else hi = mid; }
    return pool[lo];
  }

  function pickChoices(level, entry) {
    var pool = window.VOCAB[level];
    var used = { }; used[entry.m] = true;
    var same = pool.filter(function (e) { return e.p === entry.p && e.w !== entry.w; });
    var any = pool.filter(function (e) { return e.w !== entry.w; });
    var src = same.length >= 8 ? same : any;
    var wrong = [];
    var guard = 0;
    while (wrong.length < 3 && guard++ < 300) {
      var c = src[(Math.random() * src.length) | 0];
      if (!used[c.m]) { used[c.m] = true; wrong.push(c.m); }
    }
    var choices = wrong.concat([entry.m]);
    // shuffle
    for (var i = choices.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = choices[i]; choices[i] = choices[j]; choices[j] = t;
    }
    return choices;
  }

  function record(entry, correct, elapsed, lv) {
    var st = studyRec();
    if (!st) return;
    st.answered++;
    if (correct) {
      st.correct++;
      if (window.onQuizCorrect) window.onQuizCorrect();
    }
    var m = st.missed[entry.w];
    if (!correct) {
      if (!m) m = st.missed[entry.w] = { m: entry.m, wrong: 0, correctStreak: 0 };
      m.wrong++; m.correctStreak = 0;
    } else if (m) {
      m.correctStreak = (m.correctStreak || 0) + 1;
    }
    // ---- word book stars (bronze=correct once, silver=<=2s, gold=3 in a row) ----
    st.words = st.words || {};
    var r = st.words[entry.w];
    if (!r) r = st.words[entry.w] = { l: lv, m: entry.m, p: entry.p, c: 0, wr: 0, s: 0, f: 0, g: 0 };
    if (correct) {
      r.c++; r.s++;
      if (elapsed <= 2) r.f = 1;
      if (r.s >= 3) r.g = 1;
    } else {
      r.wr++; r.s = 0;
    }
    // ---- combo chain (persists across battles, reset on miss) ----
    var G = window.G;
    if (G) G.combo = correct ? (G.combo || 0) + 1 : 0;
  }

  var keyHandler = null;

  // level: requested TOEIC level. opts: {time: seconds}
  function ask(level, opts) {
    opts = opts || {};
    if (!overlay) initDom();
    var lv = resolveLevel(level);
    return new Promise(function (resolve) {
      if (lv == null) { resolve({ correct: true, elapsed: 0, entry: null }); return; }
      var entry = opts.entry || pickEntry(lv);
      var choices = pickChoices(lv, entry);
      var time = (opts.time || 5) * 1000;
      var done = false;
      var t0 = performance.now();
      var raf = 0, timeoutId = 0;

      levelTag.textContent = "TOEIC " + lv + " レベル" + (lv !== level ? "（" + level + "の代替出題）" : "");
      wordEl.textContent = entry.w;
      hintEl.textContent = "【" + (POS_LABEL[entry.p] || "?") + "】 意味は？";
      resultEl.textContent = ""; resultEl.className = "";
      choicesEl.innerHTML = "";
      var btns = choices.map(function (m, i) {
        var b = document.createElement("button");
        b.className = "quiz-choice";
        b.innerHTML = '<span class="num">' + (i + 1) + '</span>' + m;
        b.addEventListener("pointerdown", function (ev) { ev.preventDefault(); answer(i); });
        choicesEl.appendChild(b);
        return b;
      });
      overlay.style.display = "flex";
      timerBar.style.transform = "scaleX(1)";

      function tick(now) {
        var left = 1 - (now - t0) / time;
        if (left <= 0) { timeUp(); return; }
        timerBar.style.transform = "scaleX(" + Math.max(0, left) + ")";
        raf = requestAnimationFrame(tick);
      }
      raf = requestAnimationFrame(tick);

      keyHandler = function (e) {
        var n = parseInt(e.key, 10);
        if (n >= 1 && n <= 4) answer(n - 1);
      };
      window.addEventListener("keydown", keyHandler);

      function finish(correct, timeout) {
        if (done) return;
        done = true;
        cancelAnimationFrame(raf);
        window.removeEventListener("keydown", keyHandler);
        var elapsed = (performance.now() - t0) / 1000;
        record(entry, correct, elapsed, lv);
        // reveal
        btns.forEach(function (b, i) {
          if (choices[i] === entry.m) b.classList.add("correct");
        });
        if (correct) {
          resultEl.textContent = elapsed <= 2 ? "かいしん！ +" + entry.w + " = " + entry.m : "せいかい！";
          resultEl.className = "ok";
          if (window.SFX) SFX.play(correct && elapsed <= 2 ? "crit" : "ok");
        } else {
          resultEl.textContent = (timeout ? "じかんぎれ… " : "ミス… ") + entry.w + " = " + entry.m;
          resultEl.className = "ng";
          if (window.SFX) SFX.play("ng");
        }
        timeoutId = setTimeout(function () {
          overlay.style.display = "none";
          resolve({ correct: correct, elapsed: elapsed, entry: entry, timeout: !!timeout, lv: lv });
        }, correct ? 650 : 1400);
      }
      function answer(i) {
        if (done) return;
        if (choices[i] !== entry.m) btns[i].classList.add("wrong");
        finish(choices[i] === entry.m, false);
      }
      function timeUp() { timerBar.style.transform = "scaleX(0)"; finish(false, true); }
    });
  }

  window.QUIZ = { ask: ask, availableLevels: availableLevels, resolveLevel: resolveLevel };
})();

</script>
<script>
// TOEIC QUEST - battle module
// BATTLE.start(enemyId, {boss}) -> Promise<{result:"win"|"lose"|"flee"|"enemyfled", exp, gold}>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function rnd(n) { return (Math.random() * n) | 0; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function pAtk() { var G = window.G; return G.player.str + window.WEAPONS[G.player.weapon].atk; }
  function pDef() { var G = window.G; return G.player.vit + window.ARMORS[G.player.armor].def; }

  function comboMult() {
    var c = (window.G && window.G.combo) || 0;
    return 1 + Math.min(c * 0.05, 0.5); // up to x1.5 at 10 chain
  }
  function refreshStatus() {
    var G = window.G, p = G.player;
    $("battle-status").innerHTML =
      '<div class="name">ゆうしゃ　Lv' + p.lv + "</div>" +
      "ＨＰ " + p.hp + "/" + p.maxhp + "<br>ＭＰ " + p.mp + "/" + p.maxmp;
    var cb = $("combo-badge");
    if (cb) {
      var c = G.combo || 0;
      cb.style.display = c >= 2 ? "block" : "none";
      cb.innerHTML = c + '<span class="cl">COMBO</span>' + (c >= 10 ? '<span class="cm">MAX x1.5</span>' : '<span class="cm">x' + (1 + Math.min(c * 0.05, 0.5)).toFixed(2) + "</span>");
      cb.classList.remove("bump"); void cb.offsetWidth; cb.classList.add("bump");
    }
  }

  function setEnemyHp(e) {
    $("enemy-hp-bar").firstElementChild.style.width = Math.max(0, 100 * e.hp / e.maxhp) + "%";
  }

  // battle message (typewriter, tap to continue handled by UI.say core)
  function bsay(text) { return window.UI.say(text, $("battle-msg")); }

  // Show a real illustration (assets/enemies/<id>.png) if it exists,
  // otherwise fall back to the emoji placeholder. Drop a PNG in and it
  // appears automatically — no code change needed.
  var artCache = {};
  function setEnemyArt(sp, id, icon) {
    sp.textContent = icon;
    sp.style.backgroundImage = "";
    sp.style.width = "";
    sp.style.height = "";
    sp.dataset.enemy = id;
    if (artCache[id] === "no") return;
    // standalone/artifact builds embed downscaled art as data URIs
    var url = (window.ENEMY_ART && window.ENEMY_ART[id]) || "assets/enemies/" + id + ".png";
    var apply = function () {
      sp.textContent = "";
      var boss = sp.classList.contains("boss");
      sp.style.width = boss ? "58vw" : "44vw";
      sp.style.maxWidth = boss ? "230px" : "180px";
      sp.style.height = sp.style.width;
      sp.style.maxHeight = sp.style.maxWidth;
      sp.style.backgroundImage = "url('" + url + "')";
      sp.style.backgroundSize = "contain";
      sp.style.backgroundRepeat = "no-repeat";
      sp.style.backgroundPosition = "center bottom";
    };
    if (artCache[id] === "ok") { apply(); return; }
    var img = new Image();
    img.onload = function () { artCache[id] = "ok"; if (sp.dataset.enemy === id) apply(); };
    img.onerror = function () { artCache[id] = "no"; };
    img.src = url;
  }

  // damage/effect popup inside the battle frame
  function bpop(text, cls) {
    var frame = $("battle-frame");
    var d = document.createElement("div");
    d.className = "battle-pop " + (cls || "");
    d.textContent = text;
    d.style.left = (35 + rnd(30)) + "%";
    frame.appendChild(d);
    setTimeout(function () { d.remove(); }, 900);
  }
  function slashFx(color) {
    var frame = $("battle-frame");
    var s = document.createElement("div");
    s.className = "slash-fx";
    if (color) s.style.background = "linear-gradient(105deg, transparent 38%, " + color + " 50%, transparent 62%)";
    frame.appendChild(s);
    setTimeout(function () { s.remove(); }, 320);
  }

  // battle backdrop image (assets/bg/<key>.png) if present
  var bgCache = {};
  function setBattleBg(key) {
    var frame = $("battle-frame");
    frame.style.backgroundImage = "";
    if (!key || bgCache[key] === "no") return;
    var url = "assets/bg/" + key + ".png";
    var apply = function () {
      frame.style.backgroundImage = "url('" + url + "')";
      frame.style.backgroundSize = "cover";
      frame.style.backgroundPosition = "center";
    };
    if (bgCache[key] === "ok") { apply(); return; }
    var img = new Image();
    img.onload = function () { bgCache[key] = "ok"; apply(); };
    img.onerror = function () { bgCache[key] = "no"; };
    img.src = url;
  }

  async function enemyAttack(e, kind, mult) {
    var G = window.G, p = G.player;
    var sp = $("enemy-sprite");
    sp.classList.add("lunge");
    setTimeout(function () { sp.classList.remove("lunge"); }, 380);
    var dmg;
    if (kind === "fire") {
      await bsay(e.name + "は ほのおを はいた！");
      dmg = Math.max(2, Math.round(e.atk * 0.55 - pDef() / 8) + rnd(4));
    } else {
      await bsay(e.name + "の こうげき！");
      dmg = Math.max(1, Math.round(e.atk / 2 - pDef() / 4) + rnd(4));
    }
    if (mult) dmg = Math.round(dmg * mult);
    p.hp = Math.max(0, p.hp - dmg);
    $("battle-screen").classList.add("shake");
    $("battle-bg").classList.add("flash-red");
    if (window.SFX) SFX.play("hit");
    setTimeout(function () {
      $("battle-screen").classList.remove("shake");
      $("battle-bg").classList.remove("flash-red");
    }, 400);
    refreshStatus();
    await bsay("ゆうしゃは " + dmg + " の\nダメージを うけた！");
  }

  function weakWordList() {
    var st = window.G && window.G.study;
    if (!st || !st.words) return [];
    return Object.keys(st.words).map(function (w) {
      var r = st.words[w];
      return { w: w, r: r };
    }).filter(function (o) { return o.r.wr > 0 && o.r.s < 2; });
  }

  async function enemyTurn(e) {
    var G = window.G;
    // revenge word curse: the enemy strikes with a word YOU missed before
    var weak = weakWordList();
    if (weak.length && Math.random() < 0.25) {
      var pick = weak[rnd(weak.length)];
      await bsay(e.name + "は のろいのことば\n『" + pick.w + "』を はなった！\n（正解すれば むこうか＋反撃！）");
      var cq = await window.QUIZ.ask(pick.r.l || e.lv, { entry: { w: pick.w, m: pick.r.m, p: pick.r.p || "n" }, time: 5 });
      if (cq.correct) {
        var cd = Math.max(1, Math.round(pAtk() * 0.8 * comboMult()));
        await bsay("のろいを うちけした！");
        await playerHit(e, cd, true, "rgba(160,220,255,.9)");
        refreshStatus();
        return e.hp <= 0 ? null : null;
      }
      await enemyAttack(e, "attack", 1.3);
      refreshStatus();
      return G.player.hp <= 0 ? "dead" : null;
    }
    if (e.traits.indexOf("flee") >= 0 && Math.random() < 0.45) {
      await bsay(e.name + "は にげだした！");
      return "fled";
    }
    if (e.traits.indexOf("heal") >= 0 && e.hp < e.maxhp * 0.3 && Math.random() < 0.6) {
      var h = Math.round(e.maxhp * 0.25);
      e.hp = Math.min(e.maxhp, e.hp + h);
      setEnemyHp(e);
      await bsay(e.name + "は じこさいせいした！\nＨＰが " + h + " かいふくした。");
      return null;
    }
    var kind = (e.traits.indexOf("fire") >= 0 && Math.random() < 0.35) ? "fire" : "attack";
    await enemyAttack(e, kind);
    if (G.player.hp <= 0) return "dead";
    if (e.traits.indexOf("double") >= 0 && Math.random() < 0.3 && kind !== "fire") {
      await enemyAttack(e, "attack");
      if (G.player.hp <= 0) return "dead";
    }
    return null;
  }

  async function playerHit(e, dmg, crit, fxColor) {
    var sp = $("enemy-sprite");
    sp.classList.add("hit");
    slashFx(fxColor);
    bpop(String(dmg), crit ? "crit" : "");
    if (window.SFX) SFX.play(crit ? "crit" : "slash");
    setTimeout(function () { sp.classList.remove("hit"); }, 120);
    e.hp = Math.max(0, e.hp - dmg);
    setEnemyHp(e);
    if (crit) await bsay("かいしんの いちげき！！\n" + e.name + "に " + dmg + " のダメージ！");
    else await bsay(e.name + "に " + dmg + " のダメージ！");
  }

  async function levelUpCheck() {
    var G = window.G, p = G.player, T = window.LEVEL_TABLE;
    while (p.lv < T.length && p.exp >= T[p.lv].exp) {
      var prev = T[p.lv - 1], next = T[p.lv];
      p.lv++;
      p.maxhp = next.maxhp; p.maxmp = next.maxmp;
      p.str = next.str; p.vit = next.vit;
      p.hp = p.maxhp; p.mp = p.maxmp; // full heal on level up (kind for mobile play)
      if (window.SFX) SFX.play("level");
      await bsay("ゆうしゃは レベル " + p.lv + " に あがった！\nＨＰ+" + (next.maxhp - prev.maxhp) + "　ちから+" + (next.str - prev.str));
      for (var i = 0; i < window.SPELLS.length; i++) {
        var s = window.SPELLS[i];
        if (s.learnLv === p.lv && p.spells.indexOf(s.id) < 0) {
          p.spells.push(s.id);
          await bsay("じゅもん『" + s.name + "』を おぼえた！\n（" + s.desc + "）");
        }
      }
      refreshStatus();
    }
  }

  async function start(enemyId, opts) {
    opts = opts || {};
    var G = window.G;
    var def = window.ENEMY_BY_ID[enemyId];
    var e = { id: def.id, name: def.name, icon: def.icon, lv: def.lv, hp: def.hp, maxhp: def.hp,
              atk: def.atk, def: def.def, exp: def.exp, gold: def.gold, traits: def.traits };
    var isBoss = e.traits.indexOf("boss") >= 0;
    var quizTime = e.traits.indexOf("hasty") >= 0 ? 3.5 : 5;

    var scr = $("battle-screen");
    scr.style.display = "block";
    setBattleBg(opts.bg);
    var sp = $("enemy-sprite");
    sp.className = isBoss ? "boss" : "";
    setEnemyArt(sp, e.id, e.icon);
    $("enemy-name-tag").textContent = e.name + "（TOEIC" + e.lv + "）";
    setEnemyHp(e);
    refreshStatus();
    if (window.SFX) SFX.play(isBoss ? "boss" : "encounter");
    await bsay(e.name + "が あらわれた！" + (quizTime < 5 ? "\n（せっかち：制限時間 " + quizTime + " 秒！）" : ""));

    var result = null, gotExp = 0, gotGold = 0;
    var revenge = []; // words missed in this battle, re-asked after 2 turns

    while (!result) {
      var cmd = await window.UI.menu($("battle-cmd"), [
        { label: "たたかう" }, { label: "じゅもん" }, { label: "どうぐ" }, { label: "にげる" }
      ], "コマンド");

      if (cmd === 0) {
        // ---- attack: answer a word at the enemy's level ----
        // in-battle revenge: a word missed earlier in this battle comes back
        var forced = null;
        for (var ri = 0; ri < revenge.length; ri++) {
          if (revenge[ri].t <= 0) { forced = revenge.splice(ri, 1)[0]; break; }
        }
        if (forced) await bsay("さっき ミスした単語だ！\nリベンジのチャンス！");
        var q = await window.QUIZ.ask(forced ? forced.lv : e.lv, forced ? { entry: forced.entry, time: quizTime } : { time: quizTime });
        refreshStatus();
        if (q.correct) {
          var crit = q.elapsed <= 2;
          var dmg = Math.max(1, Math.round((pAtk() - e.def / 2 + rnd(5)) * comboMult()));
          if (forced) { dmg = Math.round(dmg * 1.2); bpop("リベンジ！", "weak"); }
          if (crit) dmg *= 2;
          if (e.id === "metal" && !crit) dmg = 1; // metal body unless critical
          await playerHit(e, dmg, crit);
        } else {
          revenge.push({ entry: q.entry, lv: q.lv, t: 2 });
          await bsay("ゆうしゃの こうげきは\nからぶりに おわった！");
        }
        revenge.forEach(function (r) { r.t--; });
      } else if (cmd === 1) {
        // ---- spells ----
        var learned = window.SPELLS.filter(function (s) { return G.player.spells.indexOf(s.id) >= 0 && s.type !== "field"; });
        if (!learned.length) { await bsay("まだ じゅもんを おぼえていない！"); continue; }
        var items = learned.map(function (s) {
          return { label: s.name + "　MP" + s.mp, disabled: G.player.mp < s.mp };
        });
        var si = await window.UI.menu($("battle-sub"), items, "じゅもん");
        if (si < 0) continue;
        var spell = learned[si];
        if (G.player.mp < spell.mp) { await bsay("ＭＰが たりない！"); continue; }
        G.player.mp -= spell.mp;
        refreshStatus();
        await bsay("ゆうしゃは『" + spell.name + "』を となえた！\n（TOEIC" + spell.quizLv + " の単語に こたえよ！）");
        var qs = await window.QUIZ.ask(spell.quizLv, { time: quizTime });
        refreshStatus();
        if (!qs.correct) {
          revenge.push({ entry: qs.entry, lv: qs.lv, t: 2 });
          await bsay("じゅもんは ふはつに おわった…！");
        } else if (spell.type === "heal") {
          var h = spell.power;
          G.player.hp = Math.min(G.player.maxhp, G.player.hp + h);
          refreshStatus();
          if (window.SFX) SFX.play("heal");
          await bsay("ＨＰが " + h + " かいふくした！");
        } else {
          var sd = Math.round(spell.power * (0.85 + Math.random() * 0.3) * comboMult());
          if (qs.elapsed <= 2) sd = Math.round(sd * 1.3);
          var weak = spell.elem && window.WEAK && window.WEAK[e.id] === spell.elem;
          if (weak) {
            sd = Math.round(sd * 1.5);
            bpop("じゃくてん！", "weak");
            await bsay("じゃくてんを ついた！");
          }
          var fxc = spell.elem === "fire" ? "rgba(255,150,60,.9)" : spell.elem === "thunder" ? "rgba(255,230,90,.9)" : "rgba(200,160,255,.9)";
          await playerHit(e, sd, weak || qs.elapsed <= 2, fxc);
        }
      } else if (cmd === 2) {
        // ---- items ----
        var inv = [];
        if (G.player.items.herb > 0) inv.push({ key: "herb", label: "ハーブティー ×" + G.player.items.herb });
        if (G.player.items.elixir > 0) inv.push({ key: "elixir", label: "エナジーコーヒー ×" + G.player.items.elixir });
        if (!inv.length) { await bsay("つかえる どうぐを もっていない！"); continue; }
        var ii = await window.UI.menu($("battle-sub"), inv, "どうぐ");
        if (ii < 0) continue;
        if (inv[ii].key === "herb") {
          G.player.items.herb--;
          G.player.hp = Math.min(G.player.maxhp, G.player.hp + 30);
          await bsay("ハーブティーを のんだ！\nＨＰが 30 かいふくした。");
        } else {
          G.player.items.elixir--;
          G.player.mp = Math.min(G.player.maxmp, G.player.mp + 40);
          await bsay("エナジーコーヒーを のんだ！\nＭＰが 40 かいふくした。");
        }
        refreshStatus();
      } else {
        // ---- flee ----
        if (isBoss) { await bsay("にげられない！！"); }
        else if (Math.random() < 0.55) {
          await bsay("ゆうしゃは にげだした！");
          result = { result: "flee" };
          break;
        } else {
          await bsay("しかし にげられなかった！");
        }
      }

      if (e.hp <= 0) {
        $("enemy-sprite").classList.add("dead");
        if (window.SFX) SFX.play("win");
        await bsay(e.name + "を たおした！");
        gotExp = e.exp; gotGold = e.gold;
        if (gotExp || gotGold) {
          G.player.exp += gotExp; G.player.gold += gotGold;
          await bsay("けいけんち " + gotExp + " かくとく！\n" + gotGold + " ゴールドを てにいれた！");
          await levelUpCheck();
        }
        result = { result: "win", exp: gotExp, gold: gotGold };
        break;
      }

      // enemy turn (unless player already resolved battle)
      var et = await enemyTurn(e);
      if (et === "fled") { result = { result: "enemyfled" }; break; }
      if (et === "dead") {
        await bsay("ゆうしゃは しんでしまった…");
        result = { result: "lose" };
        break;
      }
    }

    scr.style.display = "none";
    return result;
  }

  window.BATTLE = { start: start };
})();

</script>
<script>
// TOEIC QUEST - main engine (field, UI, events, save)
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rnd(n) { return (Math.random() * n) | 0; }

  // =================== SFX (WebAudio, no files) ===================
  var actx = null;
  function beep(freq, dur, type, vol, slide) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.linearRampToValueAtTime(slide, actx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  // uploaded files (assets/sfx/<name>.mp3) replace synth beeps automatically
  var sfxFiles = {};
  function sfxFile(name) {
    var f = sfxFiles[name];
    if (f === "no") return false;
    if (f) { var c = f.cloneNode(); c.volume = 0.5; c.play().catch(function () {}); return true; }
    var a = new Audio();
    a.preload = "auto";
    a.oncanplaythrough = function () { a.oncanplaythrough = null; sfxFiles[name] = a; };
    a.onerror = function () { sfxFiles[name] = "no"; };
    a.src = "assets/sfx/" + name + ".mp3";
    return false; // beep this once; file takes over when cached
  }
  window.SFX = {
    play: function (name) {
      if (sfxFile(name)) return;
      switch (name) {
        case "ok": beep(880, 0.12, "square"); beep(1320, 0.15, "square"); break;
        case "crit": beep(660, 0.08, "square"); beep(990, 0.1, "square"); beep(1560, 0.2, "square"); break;
        case "ng": beep(200, 0.3, "sawtooth", 0.05, 90); break;
        case "slash": beep(500, 0.08, "sawtooth", 0.05, 200); break;
        case "hit": beep(140, 0.22, "sawtooth", 0.07, 60); break;
        case "heal": beep(700, 0.12, "sine", 0.06, 1100); break;
        case "level": [523, 659, 784, 1046].forEach(function (f, i) { setTimeout(function () { beep(f, 0.16, "square"); }, i * 110); }); break;
        case "win": [784, 988, 1175].forEach(function (f, i) { setTimeout(function () { beep(f, 0.14, "square"); }, i * 100); }); break;
        case "encounter": beep(220, 0.15, "sawtooth", 0.06, 440); break;
        case "boss": beep(110, 0.5, "sawtooth", 0.08, 55); break;
        case "chest": beep(587, 0.1, "square"); setTimeout(function () { beep(880, 0.18, "square"); }, 110); break;
        case "stairs": beep(400, 0.12, "triangle", 0.06, 250); break;
        case "cursor": beep(1100, 0.04, "square", 0.03); break;
      }
    }
  };

  // =================== INPUT ===================
  var INPUT = window.INPUT = {
    held: { up: false, down: false, left: false, right: false },
    stack: [],
    push: function (c) { this.stack.push(c); },
    pop: function () { this.stack.pop(); },
    top: function () { return this.stack[this.stack.length - 1] || null; },
    uiActive: function () { return this.stack.length > 0; },
    pressA: function () { var t = this.top(); if (t && t.onA) t.onA(); else fieldA(); },
    pressB: function () { var t = this.top(); if (t && t.onB) t.onB(); else fieldB(); },
    pressDir: function (d) { var t = this.top(); if (t && t.onDir) t.onDir(d); }
  };

  var KEYMAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };
  window.addEventListener("keydown", function (e) {
    if (e.repeat) { if (KEYMAP[e.key]) e.preventDefault(); return; }
    var d = KEYMAP[e.key];
    if (d) { e.preventDefault(); INPUT.held[d] = true; INPUT.pressDir(d); }
    else if (e.key === "Enter" || e.key === " " || e.key === "z") INPUT.pressA();
    else if (e.key === "Escape" || e.key === "x") INPUT.pressB();
  });
  window.addEventListener("keyup", function (e) {
    var d = KEYMAP[e.key];
    if (d) INPUT.held[d] = false;
  });

  function bindHold(id, dir) {
    var el = $(id);
    function down(e) { e.preventDefault(); INPUT.held[dir] = true; INPUT.pressDir(dir); }
    function up(e) { e.preventDefault(); INPUT.held[dir] = false; }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
  }

  // =================== UI: message & menu ===================
  var UI = window.UI = {};

  UI.say = function (text, el) {
    el = el || $("msg-win");
    return new Promise(function (resolve) {
      el.style.display = "block";
      el.innerHTML = '<span class="body"></span><span class="arrow">▼</span>';
      var body = el.querySelector(".body");
      var i = 0, typing = true;
      var iv = setInterval(function () {
        if (i >= text.length) { clearInterval(iv); typing = false; return; }
        body.textContent = text.slice(0, ++i);
      }, 24);
      INPUT.push({
        onA: adv, onB: adv,
        onDir: function () {}
      });
      el.onpointerdown = function (e) { e.preventDefault(); adv(); };
      function adv() {
        if (typing) { clearInterval(iv); body.textContent = text; typing = false; return; }
        INPUT.pop();
        el.onpointerdown = null;
        el.style.display = "none";
        resolve();
      }
    });
  };

  UI.menu = function (el, items, title) {
    return new Promise(function (resolve) {
      var sel = 0;
      while (items[sel] && items[sel].disabled) sel++;
      function render() {
        var h = title ? '<div class="menu-title">' + title + "</div>" : "";
        items.forEach(function (it, i) {
          h += '<div class="menu-item' + (i === sel ? " sel" : "") + (it.disabled ? " disabled" : "") + '" data-i="' + i + '">' + it.label + "</div>";
        });
        el.innerHTML = h;
        el.querySelectorAll(".menu-item").forEach(function (n) {
          n.onpointerdown = function (e) {
            e.preventDefault();
            var i = +n.getAttribute("data-i");
            if (items[i].disabled) return;
            close(i);
          };
        });
      }
      function close(v) {
        INPUT.pop();
        el.style.display = "none";
        resolve(v);
      }
      INPUT.push({
        onA: function () { if (!items[sel].disabled) { SFX.play("cursor"); close(sel); } },
        onB: function () { close(-1); },
        onDir: function (d) {
          if (d === "up" || d === "left") sel = (sel + items.length - 1) % items.length;
          else if (d === "down" || d === "right") sel = (sel + 1) % items.length;
          SFX.play("cursor");
          render();
        }
      });
      el.style.display = "block";
      render();
    });
  };

  function fade(on) {
    var f = $("fade-layer");
    f.classList.toggle("on", on);
    return wait(380);
  }

  // =================== GAME STATE ===================
  var SAVE_KEY = "tq_save_v1";
  var G = null;

  function newGame() {
    var t = window.LEVEL_TABLE[0];
    window.G = G = {
      player: {
        lv: 1, exp: 0, gold: 30,
        maxhp: t.maxhp, hp: t.maxhp, maxmp: t.maxmp, mp: t.maxmp,
        str: t.str, vit: t.vit,
        weapon: 0, armor: 0,
        items: { herb: 2, wing: 0, elixir: 0, key: 0 },
        spells: []
      },
      pos: { map: "castle", x: 9, y: 4, dir: "up" },
      flags: {},
      chests: {},
      combo: 0,
      study: { missed: {}, answered: 0, correct: 0, words: {} }
    };
  }

  function saveGame() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {}
  }
  function loadGame() {
    try {
      var s = localStorage.getItem(SAVE_KEY);
      if (!s) return false;
      window.G = G = JSON.parse(s);
      return true;
    } catch (e) { return false; }
  }
  function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

  function curMap() { return window.MAPS[G.pos.map]; }
  function mapTrack(m) {
    if (m.kind === "world") return "field";
    if (m.kind === "dungeon") return m.id === "maou" ? "boss" : "dungeon";
    return "town";
  }
  function playMapBgm() { if (window.BGM) BGM.play(mapTrack(curMap())); }
  function tileAt(m, x, y) {
    if (x < 0 || y < 0 || x >= m.w || y >= m.h) return "=";
    return m.rows[y][x];
  }
  function eventAt(m, x, y) {
    for (var i = 0; i < (m.events || []).length; i++) {
      var ev = m.events[i];
      if (ev.x === x && ev.y === y) return ev;
    }
    return null;
  }

  var SOLID = { w: 1, m: 1, "=": 1 };
  function isBlocked(m, x, y) {
    var t = tileAt(m, x, y);
    if (SOLID[t]) return true;
    var ev = eventAt(m, x, y);
    if (ev && ev.type === "npc") return true;
    if (ev && ev.type === "boss" && !G.flags[ev.flag]) return true;
    return false;
  }

  // =================== ZONES / ENCOUNTERS ===================
  var CASTLE_POS = { x: 7, y: 7 };
  function zoneAt(m, x, y) {
    if (m.id !== "world") return m.zone || 0;
    var dx = x - CASTLE_POS.x, dy = y - CASTLE_POS.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 9) return 1;
    if (d < 18) return 2;
    if (d < 25) return 3;
    if (d < 31) return 4;
    if (d < 37) return 5;
    return 6;
  }
  function pickEnemy(zone) {
    var table = window.ZONE_TABLE[zone] || window.ZONE_TABLE[1];
    var total = 0;
    table.forEach(function (t) { total += t[1]; });
    var r = Math.random() * total;
    for (var i = 0; i < table.length; i++) {
      r -= table[i][1];
      if (r <= 0) return table[i][0];
    }
    return table[0][0];
  }
  var ENC_RATE = { ".": 0.09, t: 0.13, s: 0.11, "-": 0.11 };

  // =================== RENDERING ===================
  var TILE = 24, VW = 16, VH = 14;
  var canvas, ctx, dpr = 1;
  var anim = null; // {fx,fy,tx,ty,p}
  var tick = 0;

  function setupCanvas() {
    canvas = $("field-canvas");
    ctx = canvas.getContext("2d");
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = VW * TILE * dpr;
    canvas.height = VH * TILE * dpr;
    ctx.imageSmoothingEnabled = false;
  }

  var TILE_COLORS = {
    ".": ["#2f9e44", "#268a3a"], t: ["#2f9e44", "#14591f"], m: ["#7a5c33", "#5c421f"],
    w: ["#1b4fbf", "#1640a0"], s: ["#d9c06b", "#c4aa53"], b: ["#8a5a2b", "#6e4218"],
    "=": ["#8d8d99", "#6d6d7a"], ",": ["#d9cba3", "#c8b98d"], "-": ["#5a5a6e", "#4a4a5c"],
    "^": ["#d9cba3", "#333"], v: ["#5a5a6e", "#222"], c: ["#d9cba3", "#c8b98d"],
    C: ["#2f9e44", "#268a3a"], T: ["#2f9e44", "#268a3a"], D: ["#7a5c33", "#5c421f"],
    U: ["#2f9e44", "#268a3a"], X: ["#d9c06b", "#c4aa53"]
  };
  var GLYPH = { C: "🏰", T: "🏠", D: "🕳️", U: "🗼", X: "🚪" };

  function drawTile(m, x, y, px, py) {
    var t = tileAt(m, x, y);
    var c = TILE_COLORS[t] || TILE_COLORS["."];
    ctx.fillStyle = c[0];
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = c[1];
    if (t === "." || t === "C" || t === "T" || t === "U") {
      ctx.fillRect(px + 4, py + 6, 2, 2); ctx.fillRect(px + 16, py + 14, 2, 2); ctx.fillRect(px + 9, py + 19, 2, 2);
    } else if (t === "t") {
      ctx.beginPath(); ctx.moveTo(px + 12, py + 2); ctx.lineTo(px + 21, py + 20); ctx.lineTo(px + 3, py + 20); ctx.fill();
      ctx.fillStyle = "#3d2b14"; ctx.fillRect(px + 10, py + 18, 4, 5);
    } else if (t === "m" || t === "D") {
      ctx.beginPath(); ctx.moveTo(px + 12, py + 3); ctx.lineTo(px + 22, py + 21); ctx.lineTo(px + 2, py + 21); ctx.fill();
      ctx.fillStyle = "#a88b5c"; ctx.beginPath(); ctx.moveTo(px + 12, py + 3); ctx.lineTo(px + 16, py + 11); ctx.lineTo(px + 8, py + 11); ctx.fill();
    } else if (t === "w") {
      var off = (tick >> 4) % 2 ? 3 : 0;
      ctx.fillRect(px + 2 + off, py + 7, 8, 2); ctx.fillRect(px + 12 - off, py + 16, 8, 2);
    } else if (t === "s" || t === "X") {
      ctx.fillRect(px + 5, py + 8, 3, 2); ctx.fillRect(px + 14, py + 15, 3, 2);
    } else if (t === "b") {
      for (var i = 0; i < 4; i++) ctx.fillRect(px, py + 2 + i * 6, TILE, 2);
    } else if (t === "=") {
      ctx.fillRect(px, py + 7, TILE, 2); ctx.fillRect(px, py + 16, TILE, 2);
      ctx.fillRect(px + 8, py, 2, 7); ctx.fillRect(px + 16, py + 9, 2, 7); ctx.fillRect(px + 8, py + 18, 2, 6);
    } else if (t === "," || t === "-" || t === "c") {
      ctx.fillRect(px + 11, py + 11, 2, 2);
    } else if (t === "^" || t === "v") {
      ctx.fillRect(px + 4, py + 16, 16, 4); ctx.fillRect(px + 7, py + 10, 10, 4); ctx.fillRect(px + 10, py + 4, 4, 4);
    }
    if (GLYPH[t]) {
      ctx.font = "18px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(GLYPH[t], px + TILE / 2, py + TILE / 2 + 1);
    }
    // chest
    if (t === "c") {
      var ev = eventAt(m, x, y);
      var opened = ev && G.chests[ev.id];
      ctx.fillStyle = opened ? "#7a5a30" : "#a8742f";
      ctx.fillRect(px + 4, py + 8, 16, 12);
      ctx.fillStyle = opened ? "#4a3418" : "#ffd54a";
      ctx.fillRect(px + 4, py + 12, 16, 3);
      ctx.fillStyle = "#4a3418";
      ctx.fillRect(px + 4, py + 8, 16, 2);
    }
  }

  function drawEmoji(icon, px, py, size) {
    ctx.font = (size || 18) + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(icon, px + TILE / 2, py + TILE / 2 + 1);
  }

  function draw() {
    if (!G) return;
    var m = curMap();
    var px = G.pos.x, py = G.pos.y;
    if (anim) {
      px = anim.fx + (anim.tx - anim.fx) * anim.p;
      py = anim.fy + (anim.ty - anim.fy) * anim.p;
    }
    var camx = Math.max(0, Math.min(m.w - VW, px - VW / 2 + 0.5));
    var camy = Math.max(0, Math.min(m.h - VH, py - VH / 2 + 0.5));
    if (m.w <= VW) camx = (m.w - VW) / 2;
    if (m.h <= VH) camy = (m.h - VH) / 2;

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, VW * TILE, VH * TILE);

    var x0 = Math.floor(camx), y0 = Math.floor(camy);
    for (var y = y0; y <= y0 + VH; y++) {
      for (var x = x0; x <= x0 + VW; x++) {
        if (x < 0 || y < 0 || x >= m.w || y >= m.h) continue;
        drawTile(m, x, y, Math.round((x - camx) * TILE), Math.round((y - camy) * TILE));
      }
    }
    // events (npc, boss)
    (m.events || []).forEach(function (ev) {
      if (ev.type === "npc" || (ev.type === "boss" && !G.flags[ev.flag])) {
        drawEmoji(ev.icon, Math.round((ev.x - camx) * TILE), Math.round((ev.y - camy) * TILE), ev.type === "boss" ? 20 : 18);
      }
    });
    // player
    var hx = Math.round((px - camx) * TILE), hy = Math.round((py - camy) * TILE);
    drawEmoji("🧝", hx, hy, 19);
    // facing indicator
    ctx.fillStyle = "rgba(255,255,255,.85)";
    var d = G.pos.dir;
    if (d === "up") ctx.fillRect(hx + 10, hy, 4, 3);
    else if (d === "down") ctx.fillRect(hx + 10, hy + 21, 4, 3);
    else if (d === "left") ctx.fillRect(hx, hy + 10, 3, 4);
    else ctx.fillRect(hx + 21, hy + 10, 3, 4);

    // darkness in dark dungeons
    if (m.dark) {
      var gx = hx + TILE / 2, gy = hy + TILE / 2;
      var grad = ctx.createRadialGradient(gx, gy, TILE * 2.2, gx, gy, TILE * 4.5);
      grad.addColorStop(0, "rgba(0,0,0,0)");
      grad.addColorStop(1, "rgba(0,0,0,0.96)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, VW * TILE, VH * TILE);
    }
    ctx.restore();

    // status
    var p = G.player;
    $("status-win").innerHTML =
      '<div class="name">' + m.name + "</div>" +
      "Lv" + p.lv + "　<span class='gold-text'>" + p.gold + "G</span><br>" +
      "ＨＰ " + p.hp + "/" + p.maxhp + "<br>ＭＰ " + p.mp + "/" + p.maxmp;
  }

  // =================== FIELD LOGIC ===================
  var moving = false, bumpLatch = false, busyEvent = false;

  function dirDelta(d) {
    return d === "up" ? [0, -1] : d === "down" ? [0, 1] : d === "left" ? [-1, 0] : [1, 0];
  }

  async function tryMove(d) {
    var m = curMap();
    G.pos.dir = d;
    var dd = dirDelta(d);
    var nx = G.pos.x + dd[0], ny = G.pos.y + dd[1];
    if (isBlocked(m, nx, ny)) {
      var ev = eventAt(m, nx, ny);
      if (ev && !bumpLatch && (ev.type === "npc" || (ev.type === "boss" && !G.flags[ev.flag]))) {
        bumpLatch = true;
        interactWith(ev);
      }
      return;
    }
    moving = true;
    anim = { fx: G.pos.x, fy: G.pos.y, tx: nx, ty: ny, p: 0 };
    await new Promise(function (res) {
      function step() {
        anim.p += 0.18;
        if (anim.p >= 1) { res(); return; }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
    G.pos.x = nx; G.pos.y = ny;
    anim = null;
    moving = false;
    await stepEvents();
  }

  async function transferTo(map, x, y) {
    busyEvent = true;
    SFX.play("stairs");
    await fade(true);
    G.pos.map = map; G.pos.x = x; G.pos.y = y;
    saveGame();
    playMapBgm();
    await fade(false);
    busyEvent = false;
  }

  async function stepEvents() {
    var m = curMap();
    var t = tileAt(m, G.pos.x, G.pos.y);
    var ev = eventAt(m, G.pos.x, G.pos.y);

    if (ev) {
      if (ev.type === "enter") { await transferTo(ev.map, ev.tx, ev.ty); return; }
      if (ev.type === "stairs") { await transferTo(ev.map, ev.tx, ev.ty); return; }
      if (ev.type === "gate") {
        busyEvent = true;
        if (G.player.items.key) {
          await UI.say("『ことばのカギ』をつかった！\n扉が ゆっくりと ひらいていく…");
          busyEvent = false;
          await transferTo(ev.map, ev.tx, ev.ty);
        } else {
          await UI.say(ev.lockedMsg);
          busyEvent = false;
        }
        return;
      }
      if (ev.type === "chest" && !G.chests[ev.id]) {
        busyEvent = true;
        G.chests[ev.id] = true;
        SFX.play("chest");
        await openChest(ev.loot);
        saveGame();
        busyEvent = false;
        return;
      }
    }

    if ((t === "^" || t === "v") && m.exit && !(ev && ev.type === "stairs")) {
      await transferTo(m.exit.map, m.exit.x, m.exit.y);
      return;
    }

    // random encounter
    var rate = ENC_RATE[t];
    if (rate && (m.kind === "world" || m.kind === "dungeon") && Math.random() < rate) {
      var zone = zoneAt(m, G.pos.x, G.pos.y);
      await runBattle(pickEnemy(zone), false);
    }
  }

  async function openChest(loot) {
    if (loot.gold) {
      G.player.gold += loot.gold;
      await UI.say("たからばこを あけた！\n" + loot.gold + " ゴールドを てにいれた！");
    } else if (loot.item) {
      var n = loot.n || 1;
      G.player.items[loot.item] = (G.player.items[loot.item] || 0) + n;
      await UI.say("たからばこを あけた！\n『" + window.ITEM_DEFS[loot.item].name + "』を " + n + "こ てにいれた！");
    } else if (loot.weapon) {
      var wi = window.WEAPONS.findIndex(function (w) { return w.id === loot.weapon; });
      await UI.say("たからばこを あけた！\n『" + window.WEAPONS[wi].name + "』を てにいれた！");
      if (wi > G.player.weapon) { G.player.weapon = wi; await UI.say("さっそく そうびした！"); }
    } else if (loot.armor) {
      var ai = window.ARMORS.findIndex(function (a) { return a.id === loot.armor; });
      await UI.say("たからばこを あけた！\n『" + window.ARMORS[ai].name + "』を てにいれた！");
      if (ai > G.player.armor) { G.player.armor = ai; await UI.say("さっそく そうびした！"); }
    }
  }

  async function runBattle(enemyId, isEventBoss, bossEv) {
    busyEvent = true;
    var m = curMap();
    var bgKey = m.id === "world" ? "zone" + zoneAt(m, G.pos.x, G.pos.y) : m.id;
    var isBossFight = window.ENEMY_BY_ID[enemyId].traits.indexOf("boss") >= 0;
    if (window.BGM) BGM.play(isBossFight ? "boss" : "battle");
    var r = await window.BATTLE.start(enemyId, { bg: bgKey });
    playMapBgm();
    if (r.result === "lose") {
      await fade(true);
      G.player.gold = Math.floor(G.player.gold / 2);
      G.player.hp = G.player.maxhp;
      G.player.mp = G.player.maxmp;
      G.pos = { map: "castle", x: 9, y: 4, dir: "up" };
      await fade(false);
      await UI.say("気を おとすでない、ゆうしゃよ。\nしっぱいは 学びの もとじゃ。\n（しょじきんが はんぶんに なった）");
      saveGame();
    } else if (r.result === "win" && isEventBoss && bossEv) {
      G.flags[bossEv.flag] = true;
      if (bossEv.drops && bossEv.drops.item) {
        G.player.items[bossEv.drops.item] = (G.player.items[bossEv.drops.item] || 0) + 1;
      }
      for (var i = 0; i < (bossEv.after || []).length; i++) await UI.say(bossEv.after[i]);
      if (bossEv.enemy === "maou") await ending();
      saveGame();
    } else {
      saveGame();
    }
    await checkDaily();
    busyEvent = false;
  }

  async function ending() {
    await fade(true); await fade(false);
    await UI.say("まおう ヴォキャブロスは\nことばにならない さけびをあげ\nくずれさった…！");
    await UI.say("うばわれていた《言葉の力》が\nレキシア大陸に もどっていく…。");
    var st = G.study;
    var rate = st.answered ? Math.round(100 * st.correct / st.answered) : 0;
    await UI.say("― ぼうけんのきろく ―\nこたえた単語： " + st.answered + " 問\nせいかいりつ： " + rate + "％");
    await UI.say("だが、まなびの旅に\nおわりは ない。\n\n～ TOEIC QUEST ～\nTHANK YOU FOR PLAYING!");
    G.pos = { map: "castle", x: 9, y: 4, dir: "up" };
  }

  // =================== DAILY MISSION & STREAK ===================
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function ensureDaily() {
    if (!G) return;
    if (!G.daily || G.daily.date !== todayStr()) {
      G.daily = { date: todayStr(), correct: 0, goal: 20, done: false };
    }
  }
  async function checkDaily() {
    ensureDaily();
    if (!G.daily.done && G.daily.correct >= G.daily.goal) {
      G.daily.done = true;
      G.player.gold += 150;
      SFX.play("level");
      await UI.say("デイリーミッション たっせい！\n本日 " + G.daily.goal + " 問 せいかい！\nほうびに 150ゴールドを てにいれた！");
      saveGame();
    }
  }
  async function streakCheck() {
    var t = todayStr();
    if (G.lastPlay === t) return;
    var y = new Date(); y.setDate(y.getDate() - 1);
    var ys = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();
    G.streakDays = (G.lastPlay === ys) ? (G.streakDays || 0) + 1 : 1;
    G.lastPlay = t;
    if (G.streakDays >= 2) {
      var bonus = Math.min(G.streakDays, 7) * 20;
      G.player.gold += bonus;
      await UI.say("れんぞくログイン " + G.streakDays + " 日目！\nボーナス " + bonus + "ゴールドを てにいれた！");
    }
    saveGame();
  }

  // =================== INTERACTIONS ===================
  async function interactWith(ev) {
    busyEvent = true;
    if (ev.type === "boss" && !G.flags[ev.flag]) {
      for (var i = 0; i < (ev.pre || []).length; i++) await UI.say(ev.pre[i]);
      busyEvent = false;
      await runBattle(ev.enemy, true, ev);
      return;
    }
    if (ev.type === "npc") {
      if (ev.king) await kingTalk();
      else if (ev.inn) await innTalk(ev);
      else if (ev.shop) await shopTalk(ev);
      else {
        for (var j = 0; j < ev.text.length; j++) await UI.say(ev.text[j]);
      }
    }
    busyEvent = false;
  }

  async function kingTalk() {
    if (G.flags.maou_down) {
      await UI.say("おお、ゆうしゃよ！\nよくぞ まおうを たおしてくれた！\nそなたこそ まことの英雄じゃ！");
      await UI.say("じゃが 学びの旅は つづく。\nこれからも 単語をきたえるのじゃぞ！");
    } else if (!G.flags.metKing) {
      G.flags.metKing = true;
      await UI.say("おお ゆうしゃよ、よくきた。\nまおう ヴォキャブロスが\n大陸の《言葉の力》を うばったのじゃ。");
      await UI.say("やつを たおせるのは\n『英単語のちから』で たたかえる\nそなただけ じゃ。");
      await UI.say("たたかいかたは かんたんじゃ。\nてきに こうげきするとき\n英単語の意味を ５秒いないに えらぶのじゃ。");
      await UI.say("まちがえたり まにあわなければ\nこうげきは からぶりとなり\nてきの はんげきを うける。きをつけよ。");
      await UI.say("まずは 城のそばの\n『スタディの村』で そうびを ととのえよ。\nそなたの ぶうんを いのる！");
    } else {
      await UI.say("ゆうしゃよ、たびの じゅんびは\nよいか。むりは するでないぞ。");
    }
    await UI.say("がくしゅうきろくを セーブした！");
    saveGame();
  }

  async function innTalk(ev) {
    var price = ev.inn.price;
    await UI.say("ここは やどや。\nひとばん " + price + "ゴールドですが\nおとまりに なりますか？");
    var c = await UI.menu($("cmd-win"), [{ label: "はい" }, { label: "いいえ" }], "やどや");
    if (c !== 0) { await UI.say("また どうぞ。"); return; }
    if (G.player.gold < price) { await UI.say("おかねが たりないようですね…。"); return; }
    G.player.gold -= price;
    await fade(true);
    G.player.hp = G.player.maxhp;
    G.player.mp = G.player.maxmp;
    SFX.play("heal");
    await wait(400);
    await fade(false);
    await UI.say("おはようございます！\nあたまも すっきり！\n（ＨＰ・ＭＰが かいふくした！）");
    saveGame();
    // NOTE: リリース版ではここがインタースティシャル広告の表示ポイント
  }

  async function shopTalk(ev) {
    if (ev.text && ev.text.length) await UI.say(ev.text[0]);
    while (true) {
      var goods = [];
      ev.shop.items.forEach(function (id) {
        if (ev.shop.kind === "weapon") {
          var wi = window.WEAPONS.findIndex(function (w) { return w.id === id; });
          if (wi >= 0) { goods.push({ kind: "weapon", idx: wi, label: window.WEAPONS[wi].name + "　" + window.WEAPONS[wi].price + "G" }); return; }
          var ai = window.ARMORS.findIndex(function (a) { return a.id === id; });
          if (ai >= 0) { goods.push({ kind: "armor", idx: ai, label: window.ARMORS[ai].name + "　" + window.ARMORS[ai].price + "G" }); }
        } else {
          var d = window.ITEM_DEFS[id];
          goods.push({ kind: "item", id: id, label: d.name + "　" + d.price + "G" });
        }
      });
      goods.push({ label: "やめる" });
      var gi = await UI.menu($("cmd-win"), goods, "（しょじきん " + G.player.gold + "G）");
      if (gi < 0 || gi === goods.length - 1) { await UI.say("まいどありがとう ございました！"); return; }
      var g = goods[gi];
      var price = g.kind === "weapon" ? window.WEAPONS[g.idx].price : g.kind === "armor" ? window.ARMORS[g.idx].price : window.ITEM_DEFS[g.id].price;
      if (G.player.gold < price) { await UI.say("おかねが たりないよ。"); continue; }
      if (g.kind === "weapon") {
        if (g.idx <= G.player.weapon) { await UI.say("いまの ぶきのほうが つよいよ。"); continue; }
        G.player.gold -= price; G.player.weapon = g.idx;
        await UI.say(window.WEAPONS[g.idx].name + "を こうにゅうし\nさっそく そうびした！");
      } else if (g.kind === "armor") {
        if (g.idx <= G.player.armor) { await UI.say("いまの ぼうぐのほうが つよいよ。"); continue; }
        G.player.gold -= price; G.player.armor = g.idx;
        await UI.say(window.ARMORS[g.idx].name + "を こうにゅうし\nさっそく そうびした！");
      } else {
        G.player.gold -= price;
        G.player.items[g.id] = (G.player.items[g.id] || 0) + 1;
        await UI.say(window.ITEM_DEFS[g.id].name + "を こうにゅうした！");
      }
      saveGame();
    }
  }

  window.onQuizCorrect = function () { ensureDaily(); G.daily.correct++; };

    var ev = eventAt(m, G.pos.x + dd[0], G.pos.y + dd[1]);

  async function fieldItems() {
    var inv = [];
    if (G.player.items.herb > 0) inv.push({ key: "herb", label: "ハーブティー ×" + G.player.items.herb });
    if (G.player.items.elixir > 0) inv.push({ key: "elixir", label: "エナジーコーヒー ×" + G.player.items.elixir });
    if (G.player.items.wing > 0) inv.push({ key: "wing", label: "ワープの羽根ペン ×" + G.player.items.wing });
    if (G.player.items.key > 0) inv.push({ key: "key", label: "ことばのカギ" });
    if (!inv.length) { await UI.say("なにも もっていない。"); return; }
    var i = await UI.menu($("cmd-win"), inv, "どうぐ");
    if (i < 0) return;
    var k = inv[i].key;
    if (k === "herb") {
      G.player.items.herb--;
      G.player.hp = Math.min(G.player.maxhp, G.player.hp + 30);
      SFX.play("heal");
      await UI.say("ハーブティーを のんだ！\nＨＰが 30 かいふくした。");
    } else if (k === "elixir") {
      G.player.items.elixir--;
      G.player.mp = Math.min(G.player.maxmp, G.player.mp + 40);
      SFX.play("heal");
      await UI.say("エナジーコーヒーを のんだ！\nＭＰが 40 かいふくした。");
    } else if (k === "wing") {
      G.player.items.wing--;
      await UI.say("ワープの羽根ペンを つかった！");
      await transferTo("castle", 9, 4);
    } else {
      await UI.say("魔王城の とびらを ひらく カギだ。");
    }
  }

  async function fieldSpells() {
    var learned = window.SPELLS.filter(function (s) { return G.player.spells.indexOf(s.id) >= 0 && s.type !== "attack"; });
    if (!learned.length) { await UI.say("いま つかえる じゅもんは ない。"); return; }
    var items = learned.map(function (s) { return { label: s.name + "　MP" + s.mp, disabled: G.player.mp < s.mp }; });
    var i = await UI.menu($("cmd-win"), items, "じゅもん");
    if (i < 0) return;
    var s = learned[i];
    if (G.player.mp < s.mp) return;
    G.player.mp -= s.mp;
    if (s.type === "field") {
      await UI.say("『リターン』！");
      await transferTo("castle", 9, 4);
      return;
    }
    await UI.say("『" + s.name + "』！\n（TOEIC" + s.quizLv + " の単語に こたえよ！）");
    var q = await window.QUIZ.ask(s.quizLv, { time: 5 });
    if (q.correct) {
      G.player.hp = Math.min(G.player.maxhp, G.player.hp + s.power);
      SFX.play("heal");
      await UI.say("ＨＰが " + s.power + " かいふくした！");
    } else {
      await UI.say("じゅもんは ふはつに おわった…！");
    }
  }

  async function wordBook() {
    var st = G.study;
    var rate = st.answered ? Math.round(100 * st.correct / st.answered) : 0;
    var words = Object.keys(st.missed)
      .map(function (w) { return { w: w, r: st.missed[w] }; })
      .filter(function (e) { return e.r.wrong > 0; })
      .sort(function (a, b) { return b.r.wrong - a.r.wrong; });
    await UI.say("― たんごちょう ―\nこたえた単語： " + st.answered + " 問\nせいかいりつ： " + rate + "％\nにがて単語： " + words.length + " 語");
    for (var i = 0; i < Math.min(words.length, 20); i += 5) {
      var page = words.slice(i, i + 5).map(function (e) {
        return e.w + " ＝ " + e.r.m + "（×" + e.r.wrong + "）";
      }).join("\n");
      await UI.say(page);
    }
    if (words.length) await UI.say("にがて単語は 戦闘で\nでやすくなっているぞ。\nくりかえして おぼえよう！");
  }

  // =================== WORD ENCYCLOPEDIA (zukan) ===================
  var zukanBand = 400;
  function starOf(r) {
    if (!r || !r.c) return "none";
    if (r.g) return "gold";
    if (r.f) return "silver";
    return "bronze";
  }
  function renderZukan() {
    var words = (G.study && G.study.words) || {};
    var tabs = $("zukan-tabs");
    tabs.innerHTML = "";
    [400, 500, 600, 700, 800, 900].forEach(function (b) {
      var t = document.createElement("div");
      t.className = "ztab" + (b === zukanBand ? " on" : "");
      t.textContent = b;
      t.onpointerdown = function (e) { e.preventDefault(); zukanBand = b; renderZukan(); };
      tabs.appendChild(t);
    });
    var pool = (window.VOCAB[zukanBand] || []).slice().sort(function (a, b) { return a.w < b.w ? -1 : 1; });
    var nB = 0, nS = 0, nG = 0, weakN = 0;
    var rows = pool.map(function (e) {
      var r = words[e.w];
      var st = starOf(r);
      if (st !== "none") nB++;
      if (st === "silver" || st === "gold") nS++;
      if (st === "gold") nG++;
      var weak = r && r.wr > 0 && r.s < 2;
      if (weak) weakN++;
      var known = r && r.c > 0;
      return '<div class="zrow"><div class="zstar ' + st + '">★</div>' +
        '<div class="zw">' + e.w + "</div>" +
        '<div class="zm' + (known ? "" : " hidden-m") + '">' + (known ? e.m : "？？？") + "</div>" +
        (weak ? '<div class="zweak">！</div>' : "") + "</div>";
    });
    $("zukan-summary").innerHTML =
      "はっけん " + nB + "／" + pool.length +
      '　<span style="color:#cfd8e6">★' + nS + "</span>" +
      '　<span style="color:#ffd54a">★' + nG + "</span>" +
      (weakN ? '　<span style="color:#ff5a5a">にがて ' + weakN + "</span>" : "") +
      '<div style="font-size:10.5px;color:#667;margin-top:2px">★＝正解ずみ／銀★＝2秒以内で正解／金★＝3連続正解</div>';
    $("zukan-list").innerHTML = rows.join("");
    $("zukan-list").scrollTop = 0;
  }
  function openZukan() {
    return new Promise(function (resolve) {
      renderZukan();
      $("zukan").classList.add("on");
      function close() {
        INPUT.pop();
        $("zukan").classList.remove("on");
        $("zukan-close").onpointerdown = null;
        resolve();
      }
      INPUT.push({
        onA: close, onB: close,
        onDir: function (d) {
          var bands = [400, 500, 600, 700, 800, 900];
          var i = bands.indexOf(zukanBand);
          if (d === "left") zukanBand = bands[(i + 5) % 6];
          else if (d === "right") zukanBand = bands[(i + 1) % 6];
          else return;
          renderZukan();
        }
      });
      $("zukan-close").onpointerdown = function (e) { e.preventDefault(); close(); };
    });
  }

  // =================== MAIN LOOP ===================
  var screenMode = "title";
  var lastMove = 0;

  function loop(ts) {
    tick++;
    if (screenMode === "field" && G && !busyEvent && !moving && !INPUT.uiActive()) {
      var d = INPUT.held.up ? "up" : INPUT.held.down ? "down" : INPUT.held.left ? "left" : INPUT.held.right ? "right" : null;
      if (d) {
        if (ts - lastMove > 30) { lastMove = ts; tryMove(d); }
      } else {
        bumpLatch = false;
      }
    }
    if (screenMode === "field") draw();
    requestAnimationFrame(loop);
  }

  // =================== TITLE / BOOT ===================
  async function startGame(isNew) {
    $("title-screen").style.display = "none";
    screenMode = "field";
    if (isNew) {
      newGame();
      ensureDaily();
      playMapBgm();
      await fade(true); await fade(false);
      await UI.say("レキシア大陸 ―\nかつて だれもが 英語をはなせた\nゆたかな くにが あった。");
      await UI.say("しかし まおう ヴォキャブロスが\n《言葉の力》を うばい\n大陸は やみに つつまれた…。");
      await UI.say("いま ひとりの ゆうしゃが\nラーニング王のまえに めしだされた。\n（王さまに はなしかけよう。Ａボタンだ！）");
    } else {
      loadGame();
      ensureDaily();
      playMapBgm();
      await fade(true); await fade(false);
      await UI.say("がくしゅうきろくを よみこんだ！\nおかえりなさい、ゆうしゃよ。");
      await streakCheck();
    }
  }

  function refreshAd() {
    var premium = false;
    try { premium = localStorage.getItem("tq_premium") === "1"; } catch (e) {}
    $("ad-banner").classList.toggle("hidden", premium);
  }

  async function settings() {
    var premium = false;
    try { premium = localStorage.getItem("tq_premium") === "1"; } catch (e) {}
    var bgmOn = window.BGM ? BGM.isEnabled() : true;
    var c = await UI.menu($("cmd-win"), [
      { label: "ＢＧＭ： " + (bgmOn ? "ＯＮ" : "ＯＦＦ") },
      { label: "広告除去： " + (premium ? "ＯＮ（購入済み扱い）" : "ＯＦＦ") },
      { label: "がくしゅうきろくを けす" },
      { label: "とじる" }
    ], "せってい");
    if (c === 0) {
      if (window.BGM) BGM.setEnabled(!bgmOn);
      await UI.say("ＢＧＭを " + (!bgmOn ? "ＯＮ" : "ＯＦＦ") + " にした。");
      return;
    }
    c = c - 1;
    if (c === 0) {
      try { localStorage.setItem("tq_premium", premium ? "0" : "1"); } catch (e) {}
      refreshAd();
      await UI.say(premium ? "広告が ひょうじされます。" : "広告を けしました！\n（リリース版では ここが かきん となります）");
    } else if (c === 1) {
      var c2 = await UI.menu($("cmd-win"), [{ label: "やめておく" }, { label: "ほんとうに けす" }], "ほんとうに？");
      if (c2 === 1) {
        try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
        await UI.say("がくしゅうきろくを けした。");
        location.reload();
      }
    }
  }

  function boot() {
    setupCanvas();
    refreshAd();
    // key visual (assets/ui/title.png) if present
    (function () {
      var img = new Image();
      img.onload = function () {
        $("title-screen").style.background =
          "linear-gradient(rgba(2,4,20,.45), rgba(0,0,10,.82)), url('assets/ui/title.png') center/cover";
      };
      img.src = "assets/ui/title.png";
    })();
    bindHold("dpad-up", "up"); bindHold("dpad-down", "down");
    bindHold("dpad-left", "left"); bindHold("dpad-right", "right");
    $("btn-a").addEventListener("pointerdown", function (e) { e.preventDefault(); INPUT.pressA(); });
    $("btn-b").addEventListener("pointerdown", function (e) { e.preventDefault(); INPUT.pressB(); });

    var canCont = hasSave();
    $("btn-continue").style.display = canCont ? "block" : "none";
    $("btn-continue").addEventListener("click", function () { startGame(false); });
    // double-tap confirm when a save exists (no confirm() dialog: blocked in sandboxed webviews)
    var newArmed = false;
    $("btn-new").addEventListener("click", function () {
      if (canCont && !newArmed) {
        newArmed = true;
        $("btn-new").textContent = "ほんとうに はじめから？";
        setTimeout(function () {
          newArmed = false;
          $("btn-new").textContent = "はじめから";
        }, 3000);
        return;
      }
      startGame(true);
    });
    $("btn-settings").addEventListener("click", function () { settings(); });

    if (window.BGM) BGM.play("title");
    requestAnimationFrame(loop);
  }

  window.addEventListener("DOMContentLoaded", boot);
})();

</script>
