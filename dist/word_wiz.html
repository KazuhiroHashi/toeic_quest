<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>WORD WIZ - 英単語と精霊のカードバトル</title>
<style>
/* WORD WIZ - modern card-battle UI */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg0: #0b0e20;
  --bg1: #171c3a;
  --glass: rgba(255, 255, 255, .07);
  --glass-br: rgba(255, 255, 255, .14);
  --tx: #eef1ff;
  --tx-dim: #9aa3c7;
  --gold: #ffd54a;
  --pink: #ff8fa3;
  --good: #5fe3a1;
  --bad: #ff6b6b;
  --r1: #9aa3b5; --r2: #7ec8ff; --r3: #b48cff; --r4: #ffd54a; --r5: #ff9a5c;
}

html, body {
  height: 100%;
  background: var(--bg0);
  color: var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

#app {
  position: fixed; inset: 0;
  display: flex; justify-content: center;
  background:
    radial-gradient(1200px 600px at 80% -10%, #2a2f5e 0%, transparent 60%),
    radial-gradient(900px 500px at 10% 110%, #23184a 0%, transparent 60%),
    var(--bg0);
}
#frame {
  position: relative;
  width: 100%; max-width: 560px;
  height: 100%;
  display: flex; flex-direction: column;
  overflow: hidden;
}

button { font-family: inherit; color: inherit; }

/* ---------- header ---------- */
#hud {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
  z-index: 5;
}
#hud .logo-mini { font-weight: 800; letter-spacing: 1px; font-size: 15px;
  background: linear-gradient(90deg, #8ab6ff, #c9a8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chips { display: flex; gap: 8px; }
.chip {
  display: flex; align-items: center; gap: 4px;
  background: var(--glass); border: 1px solid var(--glass-br);
  border-radius: 999px; padding: 4px 10px;
  font-size: 12.5px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.chip .ic { font-size: 13px; }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }
#main { position: relative; flex: 1; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; padding: 4px 14px 90px; -webkit-overflow-scrolling: touch; }
.h1 { font-size: 19px; font-weight: 800; margin: 10px 2px 10px; letter-spacing: .5px; }
.h1 small { color: var(--tx-dim); font-weight: 600; font-size: 12px; margin-left: 8px; }

/* ---------- tabbar ---------- */
#tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex;
  background: rgba(10, 12, 28, .92);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--glass-br);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 20;
}
.tab {
  flex: 1; padding: 9px 0 10px;
  text-align: center; font-size: 11px; font-weight: 700;
  color: var(--tx-dim); background: none; border: none; cursor: pointer;
}
.tab .tic { display: block; font-size: 20px; margin-bottom: 2px; filter: grayscale(.7) opacity(.7); }
.tab.on { color: var(--tx); }
.tab.on .tic { filter: none; transform: translateY(-1px); }

/* ---------- title ---------- */
#scr-title { z-index: 40; background:
  radial-gradient(800px 500px at 50% 20%, #33285e 0%, transparent 65%), var(--bg0);
  align-items: center; justify-content: center; text-align: center; }
#title-art { width: 190px; height: 228px; margin-bottom: 8px; animation: floaty 3.2s ease-in-out infinite; filter: drop-shadow(0 18px 30px rgba(120, 90, 255, .35)); }
#title-art svg { width: 100%; height: 100%; border-radius: 18px; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
#title-logo { font-size: 42px; font-weight: 900; letter-spacing: 2px; line-height: 1.1;
  background: linear-gradient(180deg, #fff, #a8c2ff 55%, #c9a8ff); -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 8px 40px rgba(138, 122, 255, .4); }
#title-sub { color: var(--tx-dim); font-size: 13px; margin: 8px 0 34px; letter-spacing: 3px; }
.big-btn {
  display: block; width: 240px; margin: 8px auto;
  padding: 14px; border-radius: 999px; border: none; cursor: pointer;
  font-size: 16px; font-weight: 800; letter-spacing: 2px; color: #fff;
  background: linear-gradient(90deg, #6a7bff, #a86aff);
  box-shadow: 0 10px 26px rgba(106, 123, 255, .4), inset 0 1px 0 rgba(255,255,255,.35);
}
.big-btn.ghost { background: var(--glass); border: 1px solid var(--glass-br); box-shadow: none; font-weight: 700; }
.big-btn:active { transform: scale(.97); }

/* ---------- quest list ---------- */
.chapter {
  border-radius: 18px; margin-bottom: 12px; padding: 14px;
  background: linear-gradient(135deg, var(--glass), rgba(255,255,255,.03));
  border: 1px solid var(--glass-br);
}
.chapter .ct { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.chapter .cname { font-weight: 800; font-size: 15px; }
.chapter .clv { font-size: 11.5px; font-weight: 800; color: var(--gold); letter-spacing: 1px; }
.qrow {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; margin-top: 6px;
  background: rgba(0,0,0,.25); border: 1px solid transparent; border-radius: 12px;
  cursor: pointer; font-size: 13.5px; font-weight: 700;
}
.qrow:active { background: rgba(255,255,255,.08); }
.qrow.locked { opacity: .38; }
.qrow .qmeta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--tx-dim); font-weight: 600; }
.qrow .done { color: var(--good); }
.qrow.boss { border-color: rgba(255, 122, 122, .4); }
.qrow.boss .qn { color: #ff9a8a; }

/* ---------- cards ---------- */
.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ccard { position: relative; border-radius: 14px; padding: 5px 5px 7px; cursor: pointer;
  background: var(--glass); border: 2px solid var(--glass-br); text-align: center; }
.ccard:active { transform: scale(.96); }
.ccard.r3 { border-color: var(--r3); }
.ccard.r4 { border-color: var(--r4); }
.ccard.r5 { border-color: transparent; background:
  linear-gradient(var(--bg1), var(--bg1)) padding-box,
  linear-gradient(120deg, #ff9a5c, #ffd54a, #7ef29d, #7ec8ff, #c9a8ff, #ff9a5c) border-box;
  animation: holo 5s linear infinite; background-size: auto, 300% 300%; }
@keyframes holo { 0% { background-position: 0 0, 0% 50%; } 100% { background-position: 0 0, 300% 50%; } }
.ccard .art { width: 100%; aspect-ratio: 200/240; border-radius: 10px; overflow: hidden; }
.ccard .art svg { width: 100%; height: 100%; display: block; }
.ccard .nm { font-size: 11.5px; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ccard .st { font-size: 9.5px; letter-spacing: 1px; color: var(--gold); }
.ccard .lvb { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); border-radius: 8px; font-size: 10px; font-weight: 800; padding: 2px 6px; }
.ccard .eb { position: absolute; top: 8px; right: 8px; font-size: 13px; filter: drop-shadow(0 1px 2px #000); }
.ccard.dim { opacity: .35; }
.ccard .owned-check { position: absolute; bottom: 34px; right: 8px; background: var(--good); color: #05331d;
  font-size: 10px; font-weight: 900; border-radius: 8px; padding: 1px 6px; }

/* deck bar */
.deck-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.dslot { flex: 1; aspect-ratio: 200/240; border-radius: 12px; border: 2px dashed var(--glass-br);
  display: flex; align-items: center; justify-content: center; color: var(--tx-dim); font-size: 20px; cursor: pointer; overflow: hidden; position: relative; }
.dslot svg { width: 100%; height: 100%; }
.dslot.sel { border-color: var(--gold); border-style: solid; box-shadow: 0 0 14px rgba(255, 213, 74, .35); }
.dslot .lvb { position: absolute; bottom: 3px; left: 4px; background: rgba(0,0,0,.65); border-radius: 6px; font-size: 9px; font-weight: 800; padding: 1px 5px; color: var(--tx); }

/* ---------- modal ---------- */
#modal-layer { position: absolute; inset: 0; z-index: 30; display: none;
  background: rgba(5, 6, 16, .72); backdrop-filter: blur(4px);
  align-items: flex-end; justify-content: center; }
#modal-layer.on { display: flex; }
#modal {
  width: 100%; max-width: 560px; max-height: 86%;
  overflow-y: auto;
  background: linear-gradient(180deg, #1d2244, #12152c);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--glass-br);
  padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
  animation: sheet .25s ease-out;
}
@keyframes sheet { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.detail-top { display: flex; gap: 14px; }
.detail-art { width: 128px; flex: none; border-radius: 14px; overflow: hidden; }
.detail-art svg { width: 100%; display: block; }
.detail-info { flex: 1; min-width: 0; }
.detail-info .nm { font-size: 18px; font-weight: 900; }
.detail-info .stars { color: var(--gold); font-size: 13px; letter-spacing: 2px; margin: 2px 0 6px; }
.stat-row { display: flex; gap: 10px; font-size: 13px; font-weight: 800; margin: 6px 0; font-variant-numeric: tabular-nums; }
.stat-row span { color: var(--tx-dim); font-weight: 600; font-size: 11px; }
.skill-box { background: rgba(0,0,0,.3); border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: 12px; }
.skill-box b { color: #a8c2ff; display: block; font-size: 12.5px; margin-bottom: 2px; }
.flavor { color: var(--tx-dim); font-size: 11.5px; margin-top: 10px; line-height: 1.6; }
.modal-btns { display: flex; gap: 10px; margin-top: 14px; }
.mbtn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 14px; font-weight: 800; cursor: pointer;
  background: linear-gradient(90deg, #6a7bff, #a86aff); color: #fff; }
.mbtn.gold { background: linear-gradient(90deg, #ffb347, #ff8a5c); }
.mbtn.ghost { background: var(--glass); border: 1px solid var(--glass-br); }
.mbtn:disabled { opacity: .35; }
.mbtn:active { transform: scale(.97); }
.exp-bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.4); overflow: hidden; margin-top: 4px; }
.exp-bar > div { height: 100%; background: linear-gradient(90deg, #6a7bff, #7ef29d); }

/* ---------- gacha ---------- */
#gacha-stage { text-align: center; padding-top: 8vh; }
#gacha-crystal { width: 130px; height: 130px; margin: 0 auto 20px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #d7c8ff, #8a6cff 55%, #3d2d80);
  box-shadow: 0 0 60px rgba(150, 110, 255, .55), inset 0 4px 20px rgba(255,255,255,.5);
  display: flex; align-items: center; justify-content: center; font-size: 52px;
  animation: floaty 3s ease-in-out infinite; }
#gacha-result { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 12px; }
#gacha-result .ccard { width: 96px; animation: reveal .5s cubic-bezier(.2, 1.6, .4, 1) backwards; }
.rate-note { color: var(--tx-dim); font-size: 11px; margin-top: 12px; }
@keyframes reveal { from { transform: scale(.2) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- battle ---------- */
#scr-battle { background:
  radial-gradient(700px 400px at 50% -8%, #383060 0%, transparent 60%), var(--bg0); }
#b-top { flex: none; padding: calc(6px + env(safe-area-inset-top)) 12px 0; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; color: var(--tx-dim); }
#b-wave { letter-spacing: 1px; }
#b-quest-lv { color: var(--gold); }
#enemy-zone { flex: none; display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 6px 10px 2px; min-height: 148px; }
.foe { position: relative; width: 104px; cursor: pointer; transition: transform .15s; }
.foe.small { width: 86px; }
.foe .fart { width: 100%; aspect-ratio: 200/240; }
.foe .fart svg { width: 100%; height: 100%; border-radius: 12px; }
.foe.target .fart svg { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 12px; }
.foe .fhp { height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); margin-top: 4px; overflow: hidden; }
.foe .fhp > div { height: 100%; background: linear-gradient(90deg, #ff8a5c, #ff5c7a); transition: width .3s; }
.foe .fcount { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%;
  background: #2a1230; border: 2px solid #ff7aa2; color: #ffb3c8; font-size: 13px; font-weight: 900;
  display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; z-index: 2; }
.foe .fcount.hot { background: #ff3d5c; color: #fff; border-color: #fff; animation: pulse .6s infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.18); } }
.foe .fname { font-size: 9.5px; font-weight: 700; color: var(--tx-dim); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foe.dead { pointer-events: none; }
.foe.dead .fart { animation: foedie .5s forwards; }
@keyframes foedie { to { transform: scale(.1) rotate(18deg); opacity: 0; } }
.foe.hurt .fart { animation: hurtflash .25s 2; }
@keyframes hurtflash { 50% { filter: brightness(2.6) saturate(.2); transform: translateX(5px); } }

/* team status */
#team-zone { flex: none; padding: 4px 14px 0; }
#team-hp-wrap { display: flex; align-items: center; gap: 10px; }
#team-hp-bar { flex: 1; height: 14px; border-radius: 7px; background: rgba(0,0,0,.45); overflow: hidden; border: 1px solid var(--glass-br); }
#team-hp-bar > div { height: 100%; border-radius: 7px; background: linear-gradient(90deg, #5fe3a1, #7ec8ff); transition: width .3s; }
#team-hp-num { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
#chain-badge { position: absolute; right: 10px; top: 150px; z-index: 6; text-align: center;
  font-weight: 900; color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,.6); pointer-events: none; }
#chain-badge .cnum { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
#chain-badge .clbl { font-size: 9px; letter-spacing: 2px; }
#chain-badge.bump { animation: chainbump .3s; }
@keyframes chainbump { 40% { transform: scale(1.45); } }

/* deck row in battle */
#b-deck { flex: none; display: flex; gap: 7px; padding: 8px 12px 4px; }
.bcard { flex: 1; position: relative; border-radius: 10px; cursor: pointer; }
.bcard .bart { width: 100%; aspect-ratio: 200/240; border-radius: 10px; overflow: hidden; opacity: .92; }
.bcard .bart svg { width: 100%; height: 100%; display: block; }
.bcard .ss-ring { position: absolute; inset: 0; border-radius: 10px; border: 2px solid rgba(255,255,255,.18); pointer-events: none; }
.bcard .ss-fill { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(126, 200, 255, .3); border-radius: 0 0 8px 8px; pointer-events: none; transition: height .3s; }
.bcard.ss-ready { animation: ssglow 1.2s ease-in-out infinite; }
.bcard.ss-ready .ss-ring { border-color: var(--gold); }
@keyframes ssglow { 0%,100% { filter: drop-shadow(0 0 3px rgba(255,213,74,.8)); } 50% { filter: drop-shadow(0 0 12px rgba(255,213,74,1)); } }
.bcard.attacking { animation: atkjump .35s; }
@keyframes atkjump { 40% { transform: translateY(-14px) scale(1.08); } }

/* bottom interaction area */
#b-bottom { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 12px calc(10px + env(safe-area-inset-bottom)); position: relative; }
#panel-zone { display: none; flex-direction: column; gap: 8px; }
#panel-zone.on { display: flex; }
.panel-hint { text-align: center; font-size: 11.5px; color: var(--tx-dim); font-weight: 700; }
.qpanel { display: flex; align-items: center; gap: 10px; border: none; cursor: pointer;
  border-radius: 14px; padding: 12px 14px; background: var(--glass);
  border: 1px solid var(--glass-br); color: var(--tx); text-align: left; }
.qpanel:active { transform: scale(.98); background: rgba(255,255,255,.12); }
.qpanel .pcolors { display: flex; gap: 4px; }
.qpanel .pdot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 -2px 3px rgba(0,0,0,.3); }
.qpanel .plv { font-weight: 900; font-size: 15px; }
.qpanel .pdesc { margin-left: auto; font-size: 11px; color: var(--tx-dim); font-weight: 700; text-align: right; line-height: 1.5; }
.qpanel.hard { border-color: rgba(255, 154, 92, .55); }
.qpanel.hard .plv { color: var(--r5); }

/* quiz */
#quiz-zone { display: none; }
#quiz-zone.on { display: block; }
#q-word { text-align: center; font-size: 30px; font-weight: 900; letter-spacing: .5px; margin: 2px 0 2px; }
#q-meta { text-align: center; font-size: 11px; color: var(--tx-dim); font-weight: 700; margin-bottom: 6px; }
#q-timer { height: 10px; border-radius: 5px; background: rgba(0,0,0,.45); overflow: hidden; margin-bottom: 10px; }
#q-timer > div { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #5fe3a1, #ffd54a 60%, #ff5c7a); transform-origin: left; }
.q-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qc { border: 1px solid var(--glass-br); background: var(--glass); color: var(--tx);
  border-radius: 12px; padding: 13px 8px; font-size: 14.5px; font-weight: 800; cursor: pointer; }
.qc:active { background: rgba(255,255,255,.13); }
.qc.ok { background: rgba(95, 227, 161, .25); border-color: var(--good); }
.qc.ng { background: rgba(255, 92, 122, .22); border-color: var(--bad); }

/* battle message */
#b-msg { display: none; text-align: center; font-size: 15px; font-weight: 800; padding: 14px 10px;
  background: rgba(0,0,0,.35); border-radius: 14px; border: 1px solid var(--glass-br); cursor: pointer; line-height: 1.7; }
#b-msg.on { display: block; }

/* effects */
#fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
.orb { position: absolute; width: 22px; height: 22px; border-radius: 50%; z-index: 16;
  box-shadow: 0 0 14px 4px currentColor; background: currentColor; opacity: .95; }
.dmg-pop { position: absolute; font-weight: 900; font-size: 22px; z-index: 17; pointer-events: none;
  text-shadow: 0 2px 6px rgba(0,0,0,.7); animation: dmgfloat .9s ease-out forwards; font-variant-numeric: tabular-nums; }
.dmg-pop.crit { font-size: 30px; color: var(--gold); }
.dmg-pop.heal { color: var(--good); }
@keyframes dmgfloat { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: scale(1.15); } 100% { transform: translateY(-46px) scale(1); opacity: 0; } }
.grade-pop { position: absolute; left: 0; right: 0; text-align: center; top: 30%; z-index: 18; font-size: 26px; font-weight: 900;
  letter-spacing: 3px; animation: gradein .7s ease-out forwards; pointer-events: none; text-shadow: 0 4px 18px rgba(0,0,0,.6); }
@keyframes gradein { 0% { transform: scale(.4); opacity: 0; } 25% { transform: scale(1.15); opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-16px); opacity: 0; } }
#cutin { position: absolute; left: 0; right: 0; top: 34%; z-index: 25; display: none;
  padding: 14px 0; text-align: center; font-size: 20px; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(90deg, transparent, rgba(106, 123, 255, .85) 20%, rgba(168, 106, 255, .85) 80%, transparent);
  animation: cutin .9s ease forwards; }
@keyframes cutin { 0% { transform: translateX(-100%); opacity: 0; } 18% { transform: none; opacity: 1; } 82% { transform: none; opacity: 1; } 100% { transform: translateX(60%); opacity: 0; } }
.bshake { animation: bshake .4s; }
@keyframes bshake { 20% { transform: translate(-9px, 4px); } 45% { transform: translate(8px, -4px); } 70% { transform: translate(-5px, 2px); } }
.flashred::after { content: ""; position: absolute; inset: 0; background: rgba(255, 40, 70, .3); z-index: 14; animation: fadeout .45s forwards; pointer-events: none; }
@keyframes fadeout { to { opacity: 0; } }

/* result overlay */
#result-layer { position: absolute; inset: 0; z-index: 28; display: none; align-items: center; justify-content: center;
  background: rgba(6, 8, 18, .8); backdrop-filter: blur(5px); }
#result-layer.on { display: flex; }
#result-box { width: 86%; max-width: 380px; text-align: center;
  background: linear-gradient(180deg, #222750, #131630);
  border: 1px solid var(--glass-br); border-radius: 22px; padding: 24px 20px; }
#result-box h2 { font-size: 26px; font-weight: 900; margin-bottom: 12px;
  background: linear-gradient(90deg, #ffd54a, #ff9a5c); -webkit-background-clip: text; background-clip: text; color: transparent; }
#result-box h2.lose { background: linear-gradient(90deg, #8ea0c8, #5c6d94); -webkit-background-clip: text; background-clip: text; }
.r-line { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; padding: 7px 6px; border-bottom: 1px dashed rgba(255,255,255,.12); font-variant-numeric: tabular-nums; }
.r-line span { color: var(--tx-dim); font-weight: 600; }
.lvup-note { color: var(--good); font-weight: 800; font-size: 13px; margin-top: 10px; }

/* toast */
#toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50;
  background: rgba(20, 24, 48, .95); border: 1px solid var(--glass-br); color: var(--tx);

        name: isBoss ? "BOSS: " + window.WENEMY_BY_ID[CH_BOSS[ch]].name : CH_NAMES[ch] + " " + (q + 1),
        level: level, waves: waves,
        mana: Math.round(80 * scale), exp: Math.round(26 * scale),
        gemsFirst: isBoss ? 80 : 40,
        stoneFirst: isBoss ? 1 : 0
      });
    }
  }
  window.QUESTS = QUESTS;
  window.QUEST_BY_ID = {};
  QUESTS.forEach(function (qq) { window.QUEST_BY_ID[qq.id] = qq; });

  // ---- gacha ----
  window.GACHA_COST = 100;
  window.gachaRoll = function () {
    var r = Math.random() * 100;
    var rarity = r < 3 ? 5 : r < 15 ? 4 : r < 45 ? 3 : 2;
    var pool = window.CARDS.filter(function (c) { return c.r === rarity; });
    return pool[(Math.random() * pool.length) | 0].id;
  };
})();

<script>
// WORD WIZ - procedural SVG art for spirit cards & void enemies

(function () {

  function star(x, y, r, fill, op) {

      " L" + x + " " + (y + r) + " L" + (x - r * 0.28) + " " + (y + r * 0.28) +
      " L" + (x - r) + " " + y + " L" + (x - r * 0.28) + " " + (y - r * 0.28) +
      ' Z" fill="' + fill + '" opacity="' + (op || 0.9) + '"/>';
  }

  // element motif silhouette behind character
  function motif(elem, c) {
    switch (elem) {
      case "fire": return '<path d="M100 30 C120 55 132 70 132 95 C132 118 118 132 100 132 C82 132 68 118 68 95 C68 82 74 74 80 64 C80 80 88 86 92 84 C86 66 92 46 100 30 Z" fill="' + c + '" opacity=".18"/>';
      case "water": return '<path d="M100 32 C118 60 134 78 134 102 C134 124 119 138 100 138 C81 138 66 124 66 102 C66 78 82 60 100 32 Z" fill="' + c + '" opacity=".18"/>';

  function blush(x1, x2, y) {

      case "cat":
        b += '<path d="M62 78 L56 36 L90 56 Z" fill="' + P.body + '"/><path d="M65 70 L62 46 L82 58 Z" fill="' + inner + '" opacity=".75"/>' +
             '<path d="M138 78 L144 36 L110 56 Z" fill="' + P.body + '"/><path d="M135 70 L138 46 L118 58 Z" fill="' + inner + '" opacity=".75"/>' +
             '<path d="M148 158 C176 156 182 130 170 118 C174 138 162 148 146 146 Z" fill="' + P.body + '"/>';

      case "rabbit":
        b += '<ellipse cx="80" cy="42" rx="13" ry="34" fill="' + P.body + '" transform="rotate(-8 80 42)"/>' +

      case "pup":

      case "ram":
        b += '<path d="M64 62 A16 16 0 1 0 80 84 A10 10 0 1 1 64 62 Z" fill="#e8b04a"/>' +
             '<path d="M136 62 A16 16 0 1 0 120 84 A10 10 0 1 1 136 62 Z" fill="#e8b04a"/>';
        for (var i = 0; i < 7; i++) {
          var a = Math.PI * (0.16 + i * 0.113);
          b += '<circle cx="' + (100 - Math.cos(a) * 58).toFixed(1) + '" cy="' + (108 - Math.sin(a) * 50).toFixed(1) + '" r="14" fill="' + P.body + '"/>';

             '<path d="M74 44 C66 30 82 36 82 48 Z" fill="' + P.deep + '" opacity=".7"/>' +
             '<path d="M64 78 L58 46 L86 62 Z" fill="' + P.body + '"/><path d="M136 78 L142 46 L114 62 Z" fill="' + P.body + '"/>';

      case "bat":
        b += '<path d="M56 96 C20 78 14 110 30 122 C36 112 44 112 50 120 C54 112 60 112 66 118 Z" fill="' + P.deep + '"/>' +
             '<path d="M144 96 C180 78 186 110 170 122 C164 112 156 112 150 120 C146 112 140 112 134 118 Z" fill="' + P.deep + '"/>' +
             '<path d="M70 66 L64 40 L88 54 Z" fill="' + P.body + '"/><path d="M130 66 L136 40 L112 54 Z" fill="' + P.body + '"/>';
        f += '<path d="M94 128 L97 134 L100 128 Z" fill="#fff"/><path d="M100 128 L103 134 L106 128 Z" fill="#fff"/>';
        break;
      case "whale":
        bodyPath = '<ellipse cx="100" cy="128" rx="66" ry="52" fill="url(#body{U})"/>';
        b += '<path d="M158 158 C186 148 190 168 178 176 C186 178 180 192 164 186 C154 182 152 168 158 158 Z" fill="' + P.body + '"/>' +
             '<path d="M96 62 C90 46 96 38 100 46 C104 38 110 46 104 62 Z" fill="#9fd9ff"/>' +
             '<circle cx="92" cy="34" r="4" fill="#9fd9ff"/><circle cx="108" cy="30" r="3" fill="#9fd9ff"/>';
        f += '<path d="M56 152 Q100 168 144 152" fill="none" stroke="#fff" stroke-width="3" opacity=".5"/>' +
             '<path d="M60 162 Q100 176 140 162" fill="none" stroke="#fff" stroke-width="3" opacity=".35"/>';

      case "mouse":
        b += '<circle cx="66" cy="52" r="20" fill="' + P.body + '"/><circle cx="66" cy="52" r="11" fill="' + inner + '" opacity=".8"/>' +
             '<circle cx="134" cy="52" r="20" fill="' + P.body + '"/><circle cx="134" cy="52" r="11" fill="' + inner + '" opacity=".8"/>' +
             '<path d="M148 170 C170 176 178 160 170 150 C172 162 160 168 148 162 Z" fill="' + P.body + '" opacity=".9"/>';
        break;
      case "blob":
        bodyPath = '<path d="M100 40 C142 40 158 74 154 110 C170 116 168 136 152 138 C150 168 128 184 100 184 C72 184 50 168 48 138 C32 136 30 116 46 110 C42 74 58 40 100 40 Z" fill="url(#body{U})"/>';

  function svg(card, opts) {

      body: enemy ? "#332b47" : E.c1,
      body2: enemy ? "#1c1730" : E.c2,
      deep: enemy ? "#241d38" : E.deep
    };
    var sp = species(card.sp, P, opts);

      '<radialGradient id="bg' + u + '" cx="50%" cy="32%" r="80%">' +
      '<stop offset="0%" stop-color="' + (enemy ? "#3d3355" : E.c2) + '"/>' +
      '<stop offset="100%" stop-color="' + (enemy ? "#120e20" : E.deep) + '"/></radialGradient>' +

      s += '<circle cx="100" cy="118" r="78" fill="none" stroke="' + E.c2 + '" stroke-width="3" opacity=".55"/>' +

           star(100, 34, 8, E.c2, 0.9) + star(28, 118, 6, E.c2, 0.7) + star(172, 118, 6, E.c2, 0.7);

    s += sp.behind.replace(/\{U\}/g, u);

    s += (sp.bodyPath || '<circle cx="100" cy="118" r="62" fill="url(#body{U})"/>').replace(/\{U\}/g, u);

    // feet nubs
    s += '<ellipse cx="76" cy="184" rx="13" ry="9" fill="' + P.body + '"/><ellipse cx="124" cy="184" rx="13" ry="9" fill="' + P.body + '"/>';
    // face
    var eyeY = card.sp === "whale" ? 114 : 106;

    } else {
      s += eyes(80, 120, eyeY, null, false);
      s += card.sp === "cat" ? catMouth(eyeY + 18) : card.sp === "bird" ? "" : smile(eyeY + 18);
      s += blush(66, 134, eyeY + 14);
    }
    s += sp.front.replace(/\{U\}/g, u);
    // witch hat (mascot)
    if (card.hat) {
      s += '<g transform="rotate(-8 100 60)">' +
           '<ellipse cx="100" cy="62" rx="44" ry="11" fill="#43306b"/>' +
           '<path d="M100 -2 C112 20 118 40 122 58 C108 66 92 66 78 58 C84 38 90 18 100 -2 Z" fill="#54408a"/>' +
           '<path d="M78 52 Q100 62 122 52 L122 58 Q100 68 78 58 Z" fill="#8a5fd6"/>' +
           star(112, 30, 6, "#ffd54a", 1) + "</g>";
    }
    if (opts.boss) {
      s += '<path d="M72 30 L80 12 L92 26 L100 8 L108 26 L120 12 L128 30 Z" fill="#ffd54a" stroke="#c8951d" stroke-width="2"/>';
    }
    return s + "</svg>";
  }

  window.CardArt = { svg: svg };
})();

<script>
// WORD WIZ - battle engine
// WBATTLE.start(quest, team) -> Promise<{win:boolean}>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rndi(n) { return (Math.random() * n) | 0; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = rndi(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  var B = null; // battle state

  // ---------- vocab helpers ----------
  var POS_LABEL = { n: "名詞", v: "動詞", adj: "形容詞", adv: "副詞", phr: "熟語" };
  function pickQuestion(level) {
    var pool = window.VOCAB[level] || window.VOCAB[400];
    var entry = pool[rndi(pool.length)];
    var used = {}; used[entry.m] = true;
    var same = pool.filter(function (e) { return e.p === entry.p && e.w !== entry.w; });
    var src = same.length >= 8 ? same : pool.filter(function (e) { return e.w !== entry.w; });
    var wrong = [];
    var guard = 0;
    while (wrong.length < 3 && guard++ < 300) {
      var c = src[rndi(src.length)];
      if (!used[c.m]) { used[c.m] = true; wrong.push(c.m); }
    }
    var choices = shuffle(wrong.concat([entry.m]));
    return { entry: entry, choices: choices, level: level };
  }

  // ---------- fx ----------
  function fxRect(el) {
    var host = $("scr-battle").getBoundingClientRect();
    var r = el.getBoundingClientRect();
    return { x: r.left - host.left + r.width / 2, y: r.top - host.top + r.height / 2 };
  }
  function dmgPop(el, text, cls) {
    var p = fxRect(el);
    var d = document.createElement("div");
    d.className = "dmg-pop " + (cls || "");
    d.textContent = text;
    d.style.left = (p.x - 30 + rndi(24)) + "px";
    d.style.top = (p.y - 30) + "px";
    d.style.color = cls ? "" : "#fff";
    $("fx-layer").appendChild(d);
    setTimeout(function () { d.remove(); }, 950);
  }
  function gradePop(text, color) {
    var g = document.createElement("div");
    g.className = "grade-pop";
    g.textContent = text;
    g.style.color = color;
    $("fx-layer").appendChild(g);
    setTimeout(function () { g.remove(); }, 750);
  }
  function orb(fromEl, toEl, color) {
    return new Promise(function (res) {
      var a = fxRect(fromEl), b = fxRect(toEl);
      var o = document.createElement("div");
      o.className = "orb";
      o.style.color = color;
      o.style.left = (a.x - 11) + "px";
      o.style.top = (a.y - 11) + "px";
      o.style.transition = "transform .32s cubic-bezier(.3,.1,.6,1)";
      $("fx-layer").appendChild(o);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          o.style.transform = "translate(" + (b.x - a.x) + "px," + (b.y - a.y) + "px) scale(1.25)";
        });
      });
      setTimeout(function () { o.remove(); res(); }, 330);
    });
  }
  function cutin(text) {
    var c = $("cutin");
    c.textContent = text;
    c.style.display = "block";
    c.style.animation = "none";
    void c.offsetWidth;
    c.style.animation = "";
    setTimeout(function () { c.style.display = "none"; }, 900);
  }
  function showMsg(text) {
    return new Promise(function (res) {
      var m = $("b-msg");
      m.innerHTML = text;
      m.classList.add("on");
      $("panel-zone").classList.remove("on");
      $("quiz-zone").classList.remove("on");
      var done = function () { m.classList.remove("on"); m.onpointerdown = null; res(); };
      m.onpointerdown = done;
      setTimeout(done, 2000);
    });
  }

  // ---------- rendering ----------
  function renderFoes() {
    var z = $("enemy-zone");
    z.innerHTML = "";
    B.foes.forEach(function (f, i) {
      var d = document.createElement("div");
      d.className = "foe" + (B.foes.length >= 3 ? " small" : "") + (i === B.target ? " target" : "") + (f.hp <= 0 ? " dead" : "");
      d.id = "foe" + i;
      d.innerHTML =
        '<div class="fcount' + (f.count <= 1 ? " hot" : "") + '">' + f.count + "</div>" +
        '<div class="fart">' + window.CardArt.svg(f.def, { enemy: true, boss: f.def.boss }) + "</div>" +
        '<div class="fhp"><div style="width:' + Math.max(0, 100 * f.hp / f.maxhp) + '%"></div></div>' +
        '<div class="fname">' + window.ELEMS[f.def.elem].icon + " " + f.def.name + "</div>";
      d.onpointerdown = function () {
        if (f.hp > 0) { B.target = i; renderFoes(); }
      };
      z.appendChild(d);
    });
    $("b-wave").textContent = "WAVE " + (B.wave + 1) + " / " + B.quest.waves.length;
  }
  function renderTeam() {
    $("team-hp-bar").firstElementChild.style.width = Math.max(0, 100 * B.hp / B.maxHp) + "%";
    $("team-hp-num").textContent = B.hp + " / " + B.maxHp;
    var cb = $("chain-badge");
    cb.querySelector(".cnum").textContent = B.chain;
    B.team.forEach(function (m, i) {
      var el = $("bcard" + i);
      var pct = Math.min(100, 100 * m.charge / m.ssNeed);
      el.querySelector(".ss-fill").style.height = pct + "%";
      el.classList.toggle("ss-ready", m.charge >= m.ssNeed);
    });
  }
  function bumpChain() {
    var cb = $("chain-badge");
    cb.classList.remove("bump");
    void cb.offsetWidth;
    cb.classList.add("bump");
  }

  function aliveFoes() { return B.foes.filter(function (f) { return f.hp > 0; }); }
  function targetFoe() {
    if (B.foes[B.target] && B.foes[B.target].hp > 0) return B.foes[B.target];
    for (var i = 0; i < B.foes.length; i++) if (B.foes[i].hp > 0) { B.target = i; return B.foes[i]; }
    return null;
  }

  // ---------- damage ----------
  async function hitFoe(foe, idx, dmg, crit) {
    foe.hp = Math.max(0, foe.hp - dmg);
    var el = $("foe" + idx);
    if (el) {
      el.classList.add("hurt");
      setTimeout(function () { el && el.classList.remove("hurt"); }, 550);
      dmgPop(el, (crit ? "" : "") + dmg, crit ? "crit" : "");
    }
    window.WSFX && WSFX.play(crit ? "crit" : "hit");
    if (foe.hp <= 0 && el) {
      el.classList.add("dead");
      window.WSFX && WSFX.play("die");
    }
  }

  async function cardAttack(memberIdx, foe, foeIdx, mult, gradeExcellent, critBonus) {
    var m = B.team[memberIdx];
    var cardEl = $("bcard" + memberIdx);
    cardEl.classList.add("attacking");
    setTimeout(function () { cardEl.classList.remove("attacking"); }, 360);
    var eMult = window.elemMult(m.card.elem, foe.def.elem);
    var dmg = m.stat.atk * eMult * mult * (1 + B.chain * 0.05);
    // answer skills
    if (m.card.as === "speed" && gradeExcellent) dmg *= 1.4;
    if (m.card.as === "chain" && B.chain >= 5) dmg *= 1.5;
    if (m.card.as === "slayer" && eMult > 1) dmg *= 1.3;
    if (B.buff.atkUp) dmg *= 1.8;
    var critP = critBonus + (m.card.as === "crit" ? 0.12 : 0);
    var crit = Math.random() < critP;
    if (crit) dmg *= 2;
    dmg = Math.max(1, Math.round(dmg * (0.92 + Math.random() * 0.16)));
    await orb(cardEl, $("foe" + foeIdx), window.ELEMS[m.card.elem].c1);
    await hitFoe(foe, foeIdx, dmg, crit);
    if (eMult > 1) dmgPop($("foe" + foeIdx), "弱点!", "crit");
  }

  // ---------- quiz phase ----------
  function askQuiz(level) {
    return new Promise(function (resolve) {
      var q = pickQuestion(level);
      var extra = B.buff.time > 0 ? 3 : 0;
      var timeMs = (5 + extra) * 1000;
      if (B.buff.time > 0) B.buff.time--;
      $("q-word").textContent = q.entry.w;
      $("q-meta").textContent = "TOEIC " + q.level + "【" + (POS_LABEL[q.entry.p] || "?") + "】" + (extra ? "　⏳+3秒" : "");
      var zone = $("q-choices");
      zone.innerHTML = "";
      var done = false, t0 = performance.now(), raf = 0;
      var bar = $("q-timer").firstElementChild;
      bar.style.transform = "scaleX(1)";
      var btns = q.choices.map(function (mm, i) {
        var b = document.createElement("button");
        b.className = "qc";
        b.textContent = mm;
        b.onpointerdown = function (e) { e.preventDefault(); answer(i); };
        zone.appendChild(b);
        return b;
      });
      $("panel-zone").classList.remove("on");
      $("quiz-zone").classList.add("on");

      function tick(now) {
        var left = 1 - (now - t0) / timeMs;
        if (left <= 0) { finish(false, timeMs / 1000, true); return; }
        bar.style.transform = "scaleX(" + left + ")";
        raf = requestAnimationFrame(tick);
      }
      raf = requestAnimationFrame(tick);

      function answer(i) {
        if (done) return;
        var ok = q.choices[i] === q.entry.m;
        if (!ok) btns[i].classList.add("ng");
        finish(ok, (performance.now() - t0) / 1000, false);
      }
      function finish(ok, elapsed, timeout) {
        if (done) return;
        done = true;
        cancelAnimationFrame(raf);
        btns.forEach(function (b, i) { if (q.choices[i] === q.entry.m) b.classList.add("ok"); });
        recordStudy(q.entry, ok);
        setTimeout(function () {
          $("quiz-zone").classList.remove("on");
          resolve({ ok: ok, elapsed: elapsed, timeout: timeout, entry: q.entry });
        }, ok ? 500 : 1200);
        if (!ok) {
          $("q-meta").textContent = "正解: " + q.entry.w + " ＝ " + q.entry.m;
          $("q-meta").style.color = "#ff8fa3";
          setTimeout(function () { $("q-meta").style.color = ""; }, 1300);
        }
      }
    });
  }
  function recordStudy(entry, ok) {
    var st = window.WSTATE;
    if (!st) return;
    st.study = st.study || { answered: 0, correct: 0 };
    st.study.answered++;
    if (ok) st.study.correct++;
  }

  // ---------- panels ----------
  function buildPanels() {
    var L = B.quest.level;
    var down = B.buff.lvdown > 0 ? 100 : 0;
    if (B.buff.lvdown > 0) B.buff.lvdown--;
    var deckElems = [];
    B.team.forEach(function (m) { if (deckElems.indexOf(m.card.elem) < 0) deckElems.push(m.card.elem); });
    var all = Object.keys(window.ELEMS);
    function pickColors(n) {
      var pool = shuffle(deckElems);
      while (pool.length < n) {
        var e = all[rndi(all.length)];
        if (pool.indexOf(e) < 0) pool.push(e);
      }
      return pool.slice(0, n);
    }
    function clampLv(x) { return Math.max(400, Math.min(900, x)); }
    return [
      { colors: pickColors(1), level: clampLv(L - 100 - down), crit: 0.05, tag: "かんたん" },
      { colors: pickColors(2), level: clampLv(L - down), crit: 0.12, tag: "ふつう" },
      { colors: pickColors(3), level: clampLv(L + 100 - down), crit: 0.30, tag: "むずかしい" }
    ];
  }

  function showPanels() {
    return new Promise(function (resolve) {
      var panels = buildPanels();
      var z = $("panel-zone");
      z.innerHTML = '<div class="panel-hint">パネルを選ぼう（高レベル＝多くの精霊が攻撃＆クリティカル率UP）</div>';
      panels.forEach(function (p, i) {
        var attackers = B.team.filter(function (m) { return p.colors.indexOf(m.card.elem) >= 0; }).length;
        var btn = document.createElement("button");
        btn.className = "qpanel" + (i === 2 ? " hard" : "");
        btn.innerHTML =
          '<div class="pcolors">' + p.colors.map(function (c) {
            return '<div class="pdot" style="background:linear-gradient(180deg,' + window.ELEMS[c].c2 + "," + window.ELEMS[c].c1 + ')"></div>';
          }).join("") + "</div>" +
          '<div class="plv">TOEIC ' + p.level + '</div>' +
          '<div class="pdesc">' + p.tag + "・攻撃 " + attackers + "体<br>クリ率" + Math.round(p.crit * 100) + "%</div>";
        btn.onpointerdown = function (e) { e.preventDefault(); z.classList.remove("on"); resolve(p); };
        z.appendChild(btn);
      });
      z.classList.add("on");
      renderTeam();
    });
  }

  // ---------- special skills ----------
  async function fireSS(i) {
    var m = B.team[i];
    if (m.charge < m.ssNeed) return;
    m.charge = 0;
    var ss = window.SS_DEFS[m.card.ss];
    window.WSFX && WSFX.play("ss");
    cutin(m.card.name + "「" + ss.name + "」");
    await wait(750);
    var foe = targetFoe();
    if (m.card.ss === "nuke" && foe) {
      var idx = B.foes.indexOf(foe);
      var eM = window.elemMult(m.card.elem, foe.def.elem);
      var dmg = Math.round(m.stat.atk * 3.5 * eM * (1 + B.chain * 0.05));
      await orb($("bcard" + i), $("foe" + idx), window.ELEMS[m.card.elem].c1);
      await hitFoe(foe, idx, dmg, true);
    } else if (m.card.ss === "aoe") {
      for (var fi = 0; fi < B.foes.length; fi++) {
        var f = B.foes[fi];
        if (f.hp <= 0) continue;
        var d2 = Math.round(m.stat.atk * 2.2 * window.elemMult(m.card.elem, f.def.elem) * (1 + B.chain * 0.05));
        await orb($("bcard" + i), $("foe" + fi), window.ELEMS[m.card.elem].c1);
        await hitFoe(f, fi, d2, false);
      }
    } else if (m.card.ss === "heal30") {
      B.hp = Math.min(B.maxHp, B.hp + Math.round(B.maxHp * 0.3));
      dmgPop($("team-hp-bar"), "+" + Math.round(B.maxHp * 0.3), "heal");
      window.WSFX && WSFX.play("heal");
    } else if (m.card.ss === "time3") {
      B.buff.time = 3;
    } else if (m.card.ss === "lvdown") {
      B.buff.lvdown = 3;
    } else if (m.card.ss === "chain5") {
      B.chain += 5; bumpChain();
    } else if (m.card.ss === "shield") {
      B.buff.shield = 1;
    } else if (m.card.ss === "buff") {
      B.buff.atkUpNext = true;
    }
    renderTeam();
    renderFoes();
    await checkWaveClear();
  }

  // ---------- enemy turn ----------
  async function enemyTurn() {
    var guards = B.team.filter(function (m) { return m.card.as === "guard"; }).length;
    for (var i = 0; i < B.foes.length; i++) {
      var f = B.foes[i];
      if (f.hp <= 0) continue;
      f.count--;
      if (f.count <= 0) {
        f.count = f.def.count;
        var dmg = Math.round(f.atk * (0.9 + Math.random() * 0.2));
        dmg = Math.round(dmg * Math.pow(0.85, guards));
        if (B.buff.shield) { dmg = Math.round(dmg * 0.2); B.buff.shield = 0; dmgPop($("team-hp-bar"), "GUARD!", "heal"); }
        B.hp = Math.max(0, B.hp - dmg);
        var scr = $("scr-battle");
        scr.classList.add("bshake", "flashred");
        window.WSFX && WSFX.play("edmg");
        dmgPop($("team-hp-bar"), "-" + dmg, "");
        setTimeout(function () { scr.classList.remove("bshake", "flashred"); }, 500);
        await wait(450);
      }
    }
    renderFoes();
    renderTeam();
  }

  // ---------- waves ----------
  function loadWave() {
    var defs = B.quest.waves[B.wave];
    B.foes = defs.map(function (d) {
      var base = window.WENEMY_BY_ID[d.id];
      return {
        def: base,
        hp: Math.round(base.hp * d.scale), maxhp: Math.round(base.hp * d.scale),
        atk: Math.round(base.atk * (1 + (d.scale - 1) * 0.55)),
        count: base.count
      };
    });
    B.target = 0;
    renderFoes();
  }
  async function checkWaveClear() {
    if (aliveFoes().length) return false;
    if (B.wave < B.quest.waves.length - 1) {
      B.wave++;
      await showMsg("WAVE CLEAR！　つぎの敵が現れた…");
      loadWave();
      return false;
    }
    B.over = "win";
    return true;
  }

  // ---------- main flow ----------
  async function start(quest, team) {
    B = {
      quest: quest,
      team: team.map(function (t) {
        return { card: t.card, stat: t.stat, charge: 0, ssNeed: window.SS_DEFS[t.card.ss].need };
      }),
      wave: 0, chain: 0, target: 0,
      buff: { time: 0, lvdown: 0, shield: 0, atkUpNext: false, atkUp: false },
      over: null
    };
    B.maxHp = B.team.reduce(function (a, m) { return a + m.stat.hp; }, 0);
    B.hp = B.maxHp;

    // deck row
    var dz = $("b-deck");
    dz.innerHTML = "";
    B.team.forEach(function (m, i) {
      var d = document.createElement("div");
      d.className = "bcard";
      d.id = "bcard" + i;
      d.innerHTML = '<div class="bart">' + window.CardArt.svg(m.card, { evo: m.evo }) + '</div><div class="ss-fill" style="height:0"></div><div class="ss-ring"></div>';
      d.onpointerdown = function () {
        if (B.team[i].charge >= B.team[i].ssNeed && !B.busy && $("panel-zone").classList.contains("on")) fireSS(i);
      };
      dz.appendChild(d);
    });
    $("b-quest-lv").textContent = quest.name + "　TOEIC" + quest.level;
    loadWave();
    renderTeam();
    await showMsg(quest.chName + "<br><b>" + quest.name + "</b>");

    while (!B.over) {
      var panel = await showPanels();
      B.busy = true;
      var q = await askQuiz(panel.level);
      if (q.ok) {
        var grade = q.elapsed <= 2 ? "EXCELLENT!" : q.elapsed <= 3.5 ? "GREAT!" : "GOOD";
        var gm = q.elapsed <= 2 ? 1.3 : q.elapsed <= 3.5 ? 1.15 : 1;
        gradePop(grade, q.elapsed <= 2 ? "#ffd54a" : q.elapsed <= 3.5 ? "#7ec8ff" : "#eef1ff");
        window.WSFX && WSFX.play(q.elapsed <= 2 ? "ex" : "ok");
        B.chain++;
        bumpChain();
        B.buff.atkUp = B.buff.atkUpNext;
        B.buff.atkUpNext = false;
        // charge SS
        B.team.forEach(function (m) { m.charge = Math.min(m.ssNeed, m.charge + 1); });
        // healers
        var healers = B.team.filter(function (m) { return m.card.as === "heal"; }).length;
        if (healers) {
          B.hp = Math.min(B.maxHp, B.hp + Math.round(B.maxHp * 0.02 * healers));
        }
        // attacks
        var excellent = q.elapsed <= 2;
        for (var i = 0; i < B.team.length; i++) {
          if (panel.colors.indexOf(B.team[i].card.elem) < 0) continue;
          var foe = targetFoe();
          if (!foe) break;
          await cardAttack(i, foe, B.foes.indexOf(foe), gm, excellent, panel.crit);
          await wait(90);
        }
        B.buff.atkUp = false;
        renderFoes();
        renderTeam();
        if (await checkWaveClear()) break;
      } else {
        B.chain = 0;
        gradePop(q.timeout ? "TIME UP…" : "MISS…", "#ff6b6b");
        window.WSFX && WSFX.play("miss");
        await wait(600);
      }
      await enemyTurn();
      if (B.hp <= 0) { B.over = "lose"; break; }
      B.busy = false;
    }
    await wait(500);
    return { win: B.over === "win" };
  }

  window.WBATTLE = { start: start };
})();

</script>
<script>
// WORD WIZ - app shell: screens, deck, enhance, gacha, save
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }

  // ---------- SFX ----------
  var actx = null;
  function beep(f, dur, type, vol, slide) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, actx.currentTime);
      if (slide) o.frequency.linearRampToValueAtTime(slide, actx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  window.WSFX = {
    play: function (n) {
      switch (n) {
        case "tap": beep(900, 0.05, "sine", 0.04); break;
        case "ok": beep(880, 0.1, "triangle"); beep(1320, 0.14, "triangle"); break;
        case "ex": [880, 1175, 1760].forEach(function (f, i) { setTimeout(function () { beep(f, 0.12, "triangle"); }, i * 60); }); break;
        case "miss": beep(220, 0.3, "sawtooth", 0.05, 110); break;
        case "hit": beep(320, 0.09, "square", 0.05, 180); break;
        case "crit": beep(520, 0.07, "square", 0.06); beep(1040, 0.16, "square", 0.06); break;
        case "die": beep(600, 0.25, "sawtooth", 0.04, 80); break;
        case "edmg": beep(130, 0.3, "sawtooth", 0.08, 60); break;
        case "heal": beep(660, 0.15, "sine", 0.06, 990); break;
        case "ss": beep(440, 0.12, "triangle", 0.07, 880); beep(880, 0.25, "triangle", 0.05, 1320); break;
        case "win": [659, 784, 988, 1319].forEach(function (f, i) { setTimeout(function () { beep(f, 0.16, "triangle"); }, i * 110); }); break;
        case "lose": [400, 350, 300, 250].forEach(function (f, i) { setTimeout(function () { beep(f, 0.2, "sine", 0.06); }, i * 150); }); break;
        case "gacha": [523, 659, 784, 1046, 1319].forEach(function (f, i) { setTimeout(function () { beep(f, 0.13, "triangle"); }, i * 80); }); break;
        case "lvup": [523, 659, 784].forEach(function (f, i) { setTimeout(function () { beep(f, 0.14, "triangle"); }, i * 90); }); break;
      }
    }
  };

  // ---------- state ----------
  var KEY = "wordwiz_save_v1";
  var S = null;

  function newState() {
    return {
      cards: { hinoko: { lv: 1, exp: 0, evo: false }, shizuku: { lv: 1, exp: 0, evo: false }, biriris: { lv: 1, exp: 0, evo: false } },
      deck: ["hinoko", "shizuku", "biriris", null, null],
      mana: 200, gems: 300, stones: 0,
      clear: {}, study: { answered: 0, correct: 0 },
      tutGacha: false
    };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try {
      var s = localStorage.getItem(KEY);
      if (s) { S = JSON.parse(s); return true; }
    } catch (e) {}
    return false;
  }

  function stars(r) { var s = ""; for (var i = 0; i < r; i++) s += "★"; return s; }
  function cardTile(card, st, extraCls) {
    var stat = st ? window.cardStat(card, st) : null;
    return '<div class="ccard r' + card.r + " " + (extraCls || "") + '" data-id="' + card.id + '">' +
      (st ? '<div class="lvb">Lv' + st.lv + (st.evo ? "+" : "") + "</div>" : "") +
      '<div class="eb">' + window.ELEMS[card.elem].icon + "</div>" +
      '<div class="art">' + window.CardArt.svg(card, { evo: st && st.evo }) + "</div>" +
      '<div class="nm">' + card.name + '</div><div class="st">' + stars(card.r) + "</div></div>";
  }

  function refreshHud() {
    $("hud-mana").textContent = S.mana;
    $("hud-gems").textContent = S.gems;
    $("hud-stones").textContent = S.stones;
  }
  function toast(text) {
    var t = $("toast");
    t.textContent = text;
    t.classList.remove("on");
    void t.offsetWidth;
    t.classList.add("on");
  }

  // ---------- screens/tabs ----------
  function show(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("on"); });
    $(id).classList.add("on");
  }
  function setTab(name) {
    document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("on", t.dataset.tab === name); });
    ["quest", "deck", "gacha", "etc"].forEach(function (n) {
      $("tabpane-" + n).style.display = n === name ? "block" : "none";
    });
    if (name === "quest") renderQuests();
    if (name === "deck") renderDeck();
    if (name === "gacha") renderGacha();
    if (name === "etc") renderEtc();
  }

  // ---------- quests ----------
  function questUnlocked(q) {
    var idx = window.QUESTS.indexOf(q);
    if (idx === 0) return true;
    return !!S.clear[window.QUESTS[idx - 1].id];
  }
  function renderQuests() {
    var z = $("tabpane-quest");
    var h = '<div class="h1">クエスト <small>魔法図書館レキシカを浄化しよう</small></div>';
    for (var ch = 0; ch < 6; ch++) {
      var qs = window.QUESTS.filter(function (q) { return q.ch === ch; });
      var anyOpen = qs.some(questUnlocked);
      h += '<div class="chapter"><div class="ct"><div class="cname">第' + (ch + 1) + "章 " + qs[0].chName +
        '</div><div class="clv">TOEIC ' + qs[0].level + "</div></div>";
      qs.forEach(function (q) {
        var open = questUnlocked(q);
        var done = !!S.clear[q.id];
        h += '<div class="qrow' + (open ? "" : " locked") + (q.no === 4 ? " boss" : "") + '" data-q="' + q.id + '">' +
          '<div class="qn">' + q.name + "</div>" +
          '<div class="qmeta">' + (done ? '<span class="done">✔クリア</span>' : "💎" + q.gemsFirst) +
          "<span>▶</span></div></div>";
      });
      h += "</div>";
      if (!anyOpen) { h += ""; }
    }
    z.innerHTML = h;
    z.querySelectorAll(".qrow").forEach(function (r) {
      r.onclick = function () {
        var q = window.QUEST_BY_ID[r.dataset.q];
        if (!questUnlocked(q)) { toast("前のクエストをクリアすると解放！"); return; }
        startQuest(q);
      };
    });
  }

  // ---------- deck ----------
  var selSlot = -1;
  function ownedList() {
    return window.CARDS.filter(function (c) { return S.cards[c.id]; });
  }
  function renderDeck() {
    var z = $("tabpane-deck");
    var h = '<div class="h1">デッキ編成 <small>スロットを選んでカードをタップ</small></div><div class="deck-bar">';
    for (var i = 0; i < 5; i++) {
      var cid = S.deck[i];
      h += '<div class="dslot' + (selSlot === i ? " sel" : "") + '" data-slot="' + i + '">';
      if (cid) {
        var st = S.cards[cid];
        h += window.CardArt.svg(window.CARD_BY_ID[cid], { evo: st.evo }) + '<div class="lvb">Lv' + st.lv + "</div>";
      } else h += "＋";
      h += "</div>";
    }
    h += "</div>";
    var total = deckTeam().reduce(function (a, m) { return a + m.stat.hp; }, 0);
    var atk = deckTeam().reduce(function (a, m) { return a + m.stat.atk; }, 0);
    h += '<div class="stat-row"><span>チームHP</span> ' + total + '　<span>総攻撃</span> ' + atk + "</div>";
    h += '<div class="h1">所持カード <small>' + ownedList().length + " / " + window.CARDS.length + '種</small></div><div class="card-grid" id="coll-grid">';
    window.CARDS.forEach(function (c) {
      var st = S.cards[c.id];
      h += st ? cardTile(c, st) : cardTile(c, null, "dim");
    });
    h += "</div>";
    z.innerHTML = h;
    z.querySelectorAll(".dslot").forEach(function (d) {
      d.onclick = function () {
        var i = +d.dataset.slot;
        if (selSlot === i && S.deck[i]) { S.deck[i] = null; selSlot = -1; save(); renderDeck(); return; }
        selSlot = i;
        renderDeck();
      };
    });
    z.querySelectorAll("#coll-grid .ccard").forEach(function (c) {
      c.onclick = function () {
        var id = c.dataset.id;
        if (!S.cards[id]) { toast("ガチャで手に入れよう！"); return; }
        if (selSlot >= 0) {
          for (var i = 0; i < 5; i++) if (S.deck[i] === id && i !== selSlot) S.deck[i] = null;
          S.deck[selSlot] = id;
          selSlot = -1;
          save();
          renderDeck();
        } else {
          showDetail(id);
        }
      };
    });
  }
  function deckTeam() {
    return S.deck.filter(Boolean).map(function (id) {
      var card = window.CARD_BY_ID[id], st = S.cards[id];
      return { card: card, stat: window.cardStat(card, st), evo: st.evo };
    });
  }

  // ---------- card detail / enhance ----------
  function expNeed(lv) { return 20 + lv * 12; }
  function addExp(id, amount) {
    var st = S.cards[id], card = window.CARD_BY_ID[id];
    var ups = 0;
    st.exp += amount;
    while (st.lv < window.cardMaxLv(card, st) && st.exp >= expNeed(st.lv)) {
      st.exp -= expNeed(st.lv);
      st.lv++; ups++;
    }
    if (st.lv >= window.cardMaxLv(card, st)) st.exp = Math.min(st.exp, expNeed(st.lv) - 1);
    return ups;
  }
  function showDetail(id) {
    var card = window.CARD_BY_ID[id], st = S.cards[id];
    var stat = window.cardStat(card, st);
    var maxLv = window.cardMaxLv(card, st);
    var atMax = st.lv >= maxLv;
    var canEvo = card.r >= 3 && !st.evo && atMax;
    var evoCost = card.r; // stones
    var cost1 = window.lvUpCost(st.lv);
    var need = expNeed(st.lv);
    var m = $("modal");
    m.innerHTML =
      '<div class="detail-top"><div class="detail-art">' + window.CardArt.svg(card, { evo: st.evo }) + "</div>" +
      '<div class="detail-info"><div class="nm">' + card.name + (st.evo ? "＋" : "") + '</div>' +
      '<div class="stars">' + stars(card.r) + '</div>' +
      '<div class="stat-row"><span>属性</span>' + window.ELEMS[card.elem].icon + window.ELEMS[card.elem].name +
      '　<span>Lv</span>' + st.lv + "/" + maxLv + "</div>" +
      '<div class="stat-row"><span>HP</span>' + stat.hp + '　<span>ATK</span>' + stat.atk + "</div>" +
      (atMax ? "" : '<div class="exp-bar"><div style="width:' + Math.min(100, 100 * st.exp / need) + '%"></div></div>') +
      '<div class="skill-box"><b>AS: ' + window.AS_DEFS[card.as].name + "</b>" + window.AS_DEFS[card.as].desc + "</div>" +
      '<div class="skill-box"><b>SS: ' + window.SS_DEFS[card.ss].name + "（正解" + window.SS_DEFS[card.ss].need + "でチャージ）</b>" + window.SS_DEFS[card.ss].desc + "</div>" +
      "</div></div>" +
      '<div class="flavor">' + card.flavor + "</div>" +
      '<div class="modal-btns">' +
      (atMax
        ? (canEvo ? '<button class="mbtn gold" id="btn-evo">進化する（進化石×' + evoCost + "）</button>" : '<button class="mbtn" disabled>レベルMAX</button>')
        : '<button class="mbtn" id="btn-lv1">強化 +1Lv（マナ' + cost1 + "）</button>") +
      '<button class="mbtn ghost" id="btn-close">とじる</button></div>';
    $("modal-layer").classList.add("on");
    $("btn-close").onclick = closeModal;
    var b1 = $("btn-lv1");
    if (b1) b1.onclick = function () {
      if (S.mana < cost1) { toast("マナが足りない！クエストで集めよう"); return; }
      S.mana -= cost1;
      st.lv++;
      st.exp = 0;
      WSFX.play("lvup");
      toast(card.name + " が Lv" + st.lv + " になった！");
      save(); refreshHud(); showDetail(id); renderDeck();
    };
    var be = $("btn-evo");
    if (be) be.onclick = function () {
      if (S.stones < evoCost) { toast("進化石が足りない！ボスクエスト初回クリアで入手"); return; }
      S.stones -= evoCost;
      st.evo = true;
      WSFX.play("gacha");
      toast("✨ " + card.name + " が進化した！");
      save(); refreshHud(); showDetail(id); renderDeck();
    };
  }
  function closeModal() { $("modal-layer").classList.remove("on"); }

  // ---------- gacha ----------
  function renderGacha() {
    var z = $("tabpane-gacha");
    z.innerHTML =
      '<div id="gacha-stage"><div class="h1" style="text-align:center">精霊召喚</div>' +
      '<div id="gacha-crystal">🔮</div>' +
      '<button class="big-btn" id="g1">1回 召喚（💎' + window.GACHA_COST + "）</button>" +
      '<button class="big-btn ghost" id="g10">10連 召喚（💎' + window.GACHA_COST * 10 + "）</button>" +
      '<div class="rate-note">提供割合: ★5 3% / ★4 12% / ★3 30% / ★2 55%<br>ジェムはクエスト初回クリアで手に入るよ</div>' +
      '<div id="gacha-result"></div></div>';
    $("g1").onclick = function () { doGacha(1); };
    $("g10").onclick = function () { doGacha(10); };
  }
  function doGacha(n) {
    var cost = window.GACHA_COST * n;
    if (S.gems < cost) { toast("ジェムが足りない！クエストで集めよう"); return; }
    S.gems -= cost;
    WSFX.play("gacha");
    var out = [];
    for (var i = 0; i < n; i++) {
      var id = window.gachaRoll();
      var isNew = !S.cards[id];
      if (isNew) S.cards[id] = { lv: 1, exp: 0, evo: false };
      else addExp(id, 40 + window.CARD_BY_ID[id].r * 20); // dup -> exp
      out.push({ id: id, isNew: isNew });
    }
    save(); refreshHud();
    var z = $("gacha-result");
    z.innerHTML = "";
    out.forEach(function (o, i) {
      var card = window.CARD_BY_ID[o.id];
      var t = el(cardTile(card, S.cards[o.id]));
      t.style.animationDelay = (i * 0.12) + "s";
      if (o.isNew) t.insertAdjacentHTML("beforeend", '<div class="owned-check">NEW</div>');
      t.onclick = function () { showDetail(o.id); };
      z.appendChild(t);
    });
  }

  // ---------- etc tab ----------
  function renderEtc() {
    var st = S.study || { answered: 0, correct: 0 };
    var rate = st.answered ? Math.round(100 * st.correct / st.answered) : 0;
    var premium = false;
    try { premium = localStorage.getItem("tq_premium") === "1"; } catch (e) {}
    var z = $("tabpane-etc");
    z.innerHTML =
      '<div class="h1">学習きろく</div>' +
      '<div class="chapter"><div class="r-line"><span>こたえた単語</span>' + st.answered + '問</div>' +
      '<div class="r-line"><span>正解率</span>' + rate + '%</div></div>' +
      '<div class="h1">せってい</div>' +
      '<div class="chapter">' +
      '<button class="mbtn ghost" style="width:100%" id="btn-premium">広告除去: ' + (premium ? "ON（購入済み扱い）" : "OFF") + "</button>" +
      '<button class="mbtn ghost" style="width:100%;margin-top:8px" id="btn-title">タイトルへ戻る</button>' +
      '<button class="mbtn ghost" style="width:100%;margin-top:8px;color:#ff8fa3" id="btn-reset">データをリセット</button></div>' +
      '<div class="rate-note">姉妹作「TOEIC QUEST」も同リポジトリで遊べます</div>';
    $("btn-premium").onclick = function () {
      try { localStorage.setItem("tq_premium", premium ? "0" : "1"); } catch (e) {}
      refreshAd(); renderEtc();
    };
    $("btn-title").onclick = function () { show("scr-title"); };
    var armed = false;
    $("btn-reset").onclick = function () {
      if (!armed) { armed = true; $("btn-reset").textContent = "ほんとうにリセットする？（もう一度タップ）"; return; }
      try { localStorage.removeItem(KEY); } catch (e) {}
      location.reload();
    };
  }
  function refreshAd() {
    var premium = false;
    try { premium = localStorage.getItem("tq_premium") === "1"; } catch (e) {}
    $("ad-bar").classList.toggle("hidden", premium);
  }

  // ---------- quest flow ----------
  async function startQuest(q) {
    var team = deckTeam();
    if (!team.length) { toast("デッキにカードをセットしよう！"); setTab("deck"); return; }
    show("scr-battle");
    var res = await window.WBATTLE.start(q, team);
    // result
    var box = $("result-box");
    if (res.win) {
      WSFX.play("win");
      var first = !S.clear[q.id];
      S.clear[q.id] = true;
      S.mana += q.mana;
      var gems = first ? q.gemsFirst : Math.round(q.gemsFirst * 0.1);
      S.gems += gems;
      var stones = first ? q.stoneFirst : 0;
      S.stones += stones;
      var ups = [];
      S.deck.filter(Boolean).forEach(function (id) {
        var u = addExp(id, q.exp);
        if (u) ups.push(window.CARD_BY_ID[id].name + " Lv" + S.cards[id].lv);
      });
      save(); refreshHud();
      box.innerHTML = "<h2>QUEST CLEAR!</h2>" +
        '<div class="r-line"><span>マナ</span>+' + q.mana + "</div>" +
        '<div class="r-line"><span>ジェム</span>+' + gems + (first ? "（初回）" : "") + "</div>" +
        (stones ? '<div class="r-line"><span>進化石</span>+' + stones + "</div>" : "") +
        '<div class="r-line"><span>カードEXP</span>各+' + q.exp + "</div>" +
        (ups.length ? '<div class="lvup-note">LEVEL UP! ' + ups.join(" / ") + "</div>" : "") +
        '<div class="modal-btns"><button class="mbtn" id="r-ok">ホームへ</button></div>';
    } else {
      WSFX.play("lose");
      box.innerHTML = '<h2 class="lose">QUEST FAILED…</h2>' +
        '<div class="rate-note">カードを強化したり、回復SS持ちを入れて再挑戦しよう。<br>まちがえた単語こそ 成長のチャンス！</div>' +
        '<div class="modal-btns"><button class="mbtn" id="r-ok">ホームへ</button></div>';
    }
    $("result-layer").classList.add("on");
    $("r-ok").onclick = function () {
      $("result-layer").classList.remove("on");
      show("scr-home");
      setTab("quest");
    };
  }

  // ---------- boot ----------
  function boot() {
    var has = load();
    if (!S) S = newState();
    refreshHud();
    refreshAd();
    $("title-art").innerHTML = window.CardArt.svg(window.CARD_BY_ID.kuronoa, { evo: true });
    $("btn-start").textContent = has ? "つづきから" : "ぼうけんを はじめる";
    $("btn-start").onclick = function () {
      WSFX.play("tap");
      show("scr-home");
      setTab("quest");
      if (!S.tutGacha) {
        S.tutGacha = true;
        save();
        setTimeout(function () {
          toast("💎300でまず召喚してみよう！（ガチャタブ）");
        }, 800);
      }
    };
    document.querySelectorAll(".tab").forEach(function (t) {
      t.onclick = function () { WSFX.play("tap"); setTab(t.dataset.tab); };
    });
    $("modal-layer").onclick = function (e) { if (e.target === $("modal-layer")) closeModal(); };
    show("scr-title");
  }
  window.addEventListener("DOMContentLoaded", function () {
    window.WSTATE = null;
    boot();
    window.WSTATE = S;
  });
})();

</script>
</body>
</html>
