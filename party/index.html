<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#05060f">
<title>WORD QUEST - 英単語バトルRPG</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="party.css">
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <div id="screen">
      <!-- field explore -->
      <div id="pfield-wrap">
        <canvas id="field-canvas"></canvas>
        <div id="status-win" class="dq-window"></div>
      </div>
      <div id="msg-win" class="dq-window"></div>
      <div id="cmd-win" class="dq-window menu-win"></div>
      <div id="sub-win" class="dq-window menu-win"></div>

      <!-- party battle -->
      <div id="pbattle-screen">
        <div id="pbattle-bg"></div>
        <div id="penemy-row"></div>
        <div id="pchain-badge"></div>
        <div id="pbattle-msg" class="dq-window"></div>
        <div id="pparty-strip"></div>
        <div id="pbattle-cmd" class="dq-window menu-win"></div>
        <div id="pbattle-sub" class="dq-window menu-win"></div>
      </div>

      <!-- quiz overlay (same ids as quiz.js expects) -->
      <div id="quiz-overlay">
        <div id="quiz-box" class="dq-window">
          <div id="quiz-level-tag"></div>
          <div id="quiz-word"></div>
          <div id="quiz-hint"></div>
          <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
          <div id="quiz-choices"></div>
          <div id="quiz-result"></div>
        </div>
      </div>

      <!-- word encyclopedia -->
      <div id="zukan">
        <div id="zukan-head">
          <div id="zukan-title">単語帳</div>
          <div id="zukan-close">✕ 閉じる</div>
        </div>
        <div id="zukan-tabs"></div>
        <div id="zukan-summary"></div>
        <div id="zukan-list"></div>
      </div>

      <div id="fade-layer"></div>

      <!-- title screen -->
      <div id="ptitle-screen">
        <div id="ptitle-inner">
          <div id="ptitle-badge">英単語 × RPG</div>
          <div id="ptitle-logo">WORD QUEST</div>
          <div id="ptitle-sub">〜 沈黙の四天王 〜</div>
          <div id="ptitle-start">▶ タップして スタート</div>
          <div id="ptitle-stamina"></div>
          <div id="ptitle-streak" style="display:none"></div>
          <div id="ptitle-records"></div>
          <div id="ptitle-menu">
            <button id="pbtn-arena" class="title-btn primary"><span class="ic">🏆</span><span class="tx">ことばの闘技場</span></button>
            <button id="pbtn-review" class="title-btn"><span class="ic">📝</span><span class="tx">今日の復習</span><span class="badge" id="review-badge"></span></button>
            <button id="pbtn-tower" class="title-btn" style="display:none"><span class="ic">🗼</span><span class="tx">挑戦の塔</span></button>
            <button id="pbtn-diff" class="title-btn"><span class="ic">⚙</span><span class="tx">難易度：ふつう</span></button>
            <button id="pbtn-zukan" class="title-btn"><span class="ic">📖</span><span class="tx">単語帳</span></button>
            <button id="pbtn-achv" class="title-btn"><span class="ic">🏅</span><span class="tx">称号・記録</span></button>
          </div>
          <div id="title-copy">4人パーティで 早押し英単語バトル。<br>2秒以内の正解で 会心の一撃！</div>
          <button id="pbtn-unlock" class="title-btn ghost">★ ぜんぶ遊ぶ（¥600・広告オフ）</button>
          <div id="ptitle-foot"><span id="pbtn-field">※ ストーリーモードは 制作中です</span></div>
        </div>
        <div id="pbtn-bgm" class="title-corner" title="BGM">🔊</div>
      </div>
    </div>

    <!-- touch controls -->
    <div id="controls">
      <div id="dpad">
        <div id="dpad-up" class="dpad-btn">▲</div>
        <div id="dpad-down" class="dpad-btn">▼</div>
        <div id="dpad-left" class="dpad-btn">◀</div>
        <div id="dpad-right" class="dpad-btn">▶</div>
      </div>
      <div id="ab-btns">
        <div>
          <div id="btn-b" class="act-btn">Ｂ</div>
          <div class="btn-label">メニュー/もどる</div>
        </div>
        <div>
          <div id="btn-a" class="act-btn">Ａ</div>
          <div class="btn-label">はなす/けってい</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../data/vocab_400.js"></script>
<script src="../data/vocab_500.js"></script>
<script src="../data/vocab_600.js"></script>
<script src="../data/vocab_700.js"></script>
<script src="../data/vocab_800.js"></script>
<script src="../data/vocab_900.js"></script>
<script src="../data/enemies.js"></script>
<script src="data/maps_wq2.js"></script>
<script src="../js/bgm.js"></script>
<script src="../js/quiz.js"></script>
<script src="js/pstore.js"></script>
<script src="js/pnative.js"></script>
<script src="js/pbattle.js"></script>
<script src="js/pfield.js"></script>
<script src="js/pmain.js"></script>
</body>
</html>
